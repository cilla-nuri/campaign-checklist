<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campaign Checklist</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
.app{display:flex;flex-direction:column;height:calc(100vh - 32px);min-height:600px;width:100%;max-width:1100px;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;background:#fff;}
.campaign-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #e5e5e5;background:#fafafa;flex-shrink:0;flex-wrap:wrap;}
.campaign-bar-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;}
.campaign-select-wrap{position:relative;flex:1;max-width:240px;}
.campaign-select-wrap select{width:100%;padding:5px 28px 5px 10px;font-size:13px;font-weight:500;color:#1a1a1a;background:#fff;border:1px solid #e0e0e0;border-radius:7px;outline:none;appearance:none;cursor:pointer;}
.campaign-select-wrap .ti{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:13px;color:#aaa;pointer-events:none;}
.bar-btn{font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid #e0e0e0;background:#fff;color:#555;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.bar-btn:hover{background:#f5f5f5;}
.bar-btn.new{border-color:#7F77DD55;color:#534AB7;background:#f0efff;}
.bar-btn.new:hover{background:#e4e2ff;}
.bar-btn.danger{color:#e24b4a;border-color:#e24b4a44;}
.bar-btn.danger:hover{background:#fff5f5;}
.bar-spacer{flex:1;}
.body-wrap{display:flex;flex:1;overflow:hidden;}
.sidebar{width:230px;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;flex-shrink:0;background:#fff;}
.sidebar-header{padding:10px 12px;border-bottom:1px solid #e5e5e5;}
.header-actions{display:flex;gap:5px;flex-wrap:wrap;}
.hbtn{font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid #e0e0e0;background:transparent;color:#555;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.hbtn:hover{background:#f5f5f5;}
.search-wrap{padding:8px;border-bottom:1px solid #e5e5e5;position:relative;}
.search-wrap .ti{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:13px;color:#aaa;pointer-events:none;}
#searchInput{width:100%;padding:6px 8px 6px 28px;font-size:12px;border-radius:7px;border:1px solid #e5e5e5;background:#f9f9f9;color:#1a1a1a;outline:none;}
#searchInput:focus{border-color:#ccc;background:#fff;}
.creator-list{flex:1;overflow-y:auto;padding:6px;}
.creator-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
.creator-item:hover{background:#f5f5f5;}
.creator-item.active{background:#f0f0f0;}
.creator-item.hidden{display:none;}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;}
.creator-info{flex:1;min-width:0;}
.creator-handle{font-size:12px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.creator-nick{font-size:10px;color:#aaa;}
.ppill{font-size:10px;font-weight:600;padding:2px 6px;border-radius:20px;flex-shrink:0;background:#f0f0f0;color:#aaa;}
.empty-msg{font-size:12px;color:#aaa;text-align:center;padding:16px 8px;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:#fff;}
.main-header{padding:12px 18px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.main-title{font-size:14px;font-weight:600;color:#1a1a1a;}
.main-sub{font-size:11px;color:#aaa;margin-top:2px;}
.main-header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sbadge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;border:1px solid;cursor:pointer;white-space:nowrap;}
.feedback-btn{font-size:11px;padding:4px 10px;border-radius:7px;border:1px solid #378ADD44;color:#378ADD;background:#378ADD10;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.feedback-btn:hover{background:#378ADD20;}
.checklist-area{flex:1;overflow-y:auto;padding:14px 18px;}
.sec-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:0.07em;margin:14px 0 6px;}
.sec-label:first-child{margin-top:0;}
.chk-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;}
.chk-item:last-child{border-bottom:none;}
.chk-box{width:17px;height:17px;border-radius:5px;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.12s;background:transparent;}
.chk-box.on{background:#1D9E75;border-color:#1D9E75;}
.chk-ic{display:none;color:#fff;font-size:11px;}
.chk-box.on .chk-ic{display:block;}
.chk-lbl{font-size:12px;color:#1a1a1a;line-height:1.5;}
.chk-lbl.done{color:#bbb;text-decoration:line-through;}
.footer{padding:10px 18px;border-top:1px solid #e5e5e5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pbar-wrap{flex:1;height:3px;background:#f0f0f0;border-radius:3px;min-width:60px;}
.pbar-fill{height:100%;border-radius:3px;background:#1D9E75;transition:width 0.2s;}
.ftext{font-size:11px;color:#aaa;white-space:nowrap;}
.fbtn{font-size:11px;font-weight:500;padding:6px 12px;border-radius:7px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.fbtn:hover{background:#f5f5f5;}
.fbtn.gh-save{border-color:#1a1a1a44;background:#1a1a1a;color:#fff;}
.fbtn.gh-save:hover{background:#333;}
.fbtn.gs-save{border-color:#1D9E7544;background:#1D9E75;color:#fff;}
.fbtn.gs-save:hover{background:#189060;}
.save-status{font-size:10px;color:#aaa;white-space:nowrap;}
mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:100;align-items:flex-start;justify-content:center;padding-top:30px;}
.overlay.open{display:flex;}
.panel{background:#fff;border-radius:12px;border:1px solid #e5e5e5;width:520px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
.panel.wide{width:560px;}
.ph{padding:14px 18px;border-bottom:1px solid #e5e5e5;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.ph-title{font-size:14px;font-weight:600;color:#1a1a1a;}
.ph-sub{font-size:11px;color:#aaa;margin-top:2px;}
.xbtn{background:none;border:none;cursor:pointer;color:#999;font-size:17px;padding:2px;}
.xbtn:hover{color:#333;}
.pb{flex:1;overflow-y:auto;padding:14px 18px;}
.pf{padding:10px 18px;border-top:1px solid #e5e5e5;display:flex;align-items:center;gap:8px;}
.pf-warn{flex:1;font-size:11px;color:#aaa;}
.hint{font-size:11px;color:#aaa;line-height:1.7;margin-bottom:12px;}
.field-label{font-size:11px;color:#aaa;margin-bottom:4px;display:block;}
.field-input{width:100%;padding:8px 10px;font-size:12px;border-radius:8px;border:1px solid #e5e5e5;background:#f9f9f9;color:#1a1a1a;outline:none;font-family:inherit;margin-bottom:10px;}
.field-input:focus{border-color:#ccc;background:#fff;}
.apply-btn{font-size:11px;font-weight:500;padding:6px 14px;border-radius:7px;border:1px solid #1D9E7555;background:#1D9E7510;color:#1D9E75;cursor:pointer;}
.apply-btn:hover{background:#1D9E7520;}
.nc-input{width:100%;padding:8px 10px;font-size:13px;border-radius:8px;border:1px solid #e5e5e5;background:#f9f9f9;color:#1a1a1a;outline:none;font-family:inherit;}
.nc-input:focus{border-color:#ccc;background:#fff;}
.divider{height:1px;background:#f0f0f0;margin:12px 0;}
.how-to{background:#f9f9f9;border-radius:8px;padding:12px 14px;margin-bottom:12px;}
.how-to-title{font-size:11px;font-weight:600;color:#555;margin-bottom:8px;display:flex;align-items:center;gap:5px;}
.how-step{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px;}
.how-step:last-child{margin-bottom:0;}
.step-num{width:18px;height:18px;border-radius:50%;background:#e8e6ff;color:#534AB7;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-text{font-size:11px;color:#666;line-height:1.6;}
.step-text strong{color:#333;}
.step-text a{color:#534AB7;}
.sec-block{margin-bottom:14px;}
.sec-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.sec-inp{flex:1;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#aaa;background:transparent;border:none;outline:none;padding:2px 4px;border-radius:4px;}
.sec-inp:focus{background:#f5f5f5;}
.smb{font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid #e0e0e0;background:transparent;color:#555;cursor:pointer;}
.smb:hover{background:#f5f5f5;}
.dsbtn{font-size:13px;color:#bbb;background:none;border:none;cursor:pointer;padding:2px 4px;}
.dsbtn:hover{color:#e24b4a;}
.irow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #f5f5f5;}
.irow:last-child{border-bottom:none;}
.itxt{flex:1;font-size:12px;color:#1a1a1a;background:transparent;border:none;outline:none;padding:2px 4px;border-radius:4px;}
.itxt:focus{background:#f5f5f5;}
.dibtn{font-size:12px;color:#bbb;background:none;border:none;cursor:pointer;padding:2px 3px;opacity:0;}
.irow:hover .dibtn{opacity:1;}
.dibtn:hover{color:#e24b4a;}
.drop-zone{border:1.5px dashed #ddd;border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:background 0.1s;margin-bottom:10px;}
.drop-zone:hover,.drop-zone.drag{background:#f5f5f5;}
.drop-zone p{font-size:12px;color:#666;margin-top:6px;}
.drop-zone small{font-size:11px;color:#aaa;}
.csv-preview{margin-top:8px;}
.csv-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:11px;color:#1a1a1a;}
.csv-row:last-child{border-bottom:none;}
.csv-row span{color:#aaa;}
.feedback-area{display:flex;flex-direction:column;gap:12px;}
.feedback-meta{display:flex;gap:8px;align-items:center;}
.fmeta-label{font-size:11px;color:#aaa;}
.lang-toggle{display:flex;border:1px solid #e0e0e0;border-radius:7px;overflow:hidden;}
.lang-btn{font-size:11px;padding:4px 12px;background:#fff;border:none;color:#555;cursor:pointer;}
.lang-btn.active{background:#1a1a1a;color:#fff;}
.missing-list{background:#fff8f0;border:1px solid #EF9F2740;border-radius:8px;padding:10px 14px;}
.missing-title{font-size:11px;font-weight:600;color:#EF9F27;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.missing-item{font-size:12px;color:#555;padding:3px 0;display:flex;gap:6px;align-items:flex-start;}
.missing-num{color:#EF9F27;font-weight:600;flex-shrink:0;}
.all-good{background:#f0faf5;border:1px solid #1D9E7530;border-radius:8px;padding:14px;text-align:center;font-size:12px;color:#1D9E75;}
.msg-label{font-size:11px;color:#aaa;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;}
.msg-textarea{width:100%;min-height:150px;font-size:12px;padding:10px 12px;border-radius:8px;border:1px solid #e5e5e5;background:#f9f9f9;color:#1a1a1a;resize:vertical;outline:none;font-family:inherit;line-height:1.6;}
.msg-textarea:focus{border-color:#ccc;background:#fff;}
.copy-btn{font-size:11px;font-weight:500;padding:4px 10px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;color:#555;cursor:pointer;display:flex;align-items:center;gap:4px;}
.copy-btn:hover{background:#f5f5f5;}
.copy-btn.copied{border-color:#1D9E7555;color:#1D9E75;background:#1D9E7510;}
.save-option{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid #e5e5e5;border-radius:8px;margin-bottom:8px;}
.save-option-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.save-option-info{flex:1;}
.save-option-title{font-size:12px;font-weight:500;color:#1a1a1a;}
.save-option-sub{font-size:11px;color:#aaa;margin-top:2px;}
.save-option-status{font-size:10px;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.connected{background:#1D9E7515;color:#1D9E75;border:1px solid #1D9E7530;}
.not-connected{background:#f5f5f5;color:#aaa;border:1px solid #e5e5e5;}
.setup-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;color:#555;cursor:pointer;white-space:nowrap;}
.setup-btn:hover{background:#f5f5f5;}
.gh-load-status{font-size:12px;color:#aaa;text-align:center;padding:24px 0;}

.main-tabs{display:flex;gap:0;border-bottom:1px solid #e5e5e5;background:#fafafa;flex-shrink:0;}
.main-tab{padding:9px 18px;font-size:12px;font-weight:500;color:#999;cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;transition:color 0.15s;}
.main-tab:hover{color:#534AB7;}.main-tab.active{color:#534AB7;border-bottom-color:#534AB7;}
.sunjeong-area{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.sunjeong-toolbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid #f0f0f0;flex-wrap:wrap;flex-shrink:0;}
.sj-filter{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;color:#555;cursor:pointer;outline:none;}
.sj-search{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;outline:none;width:160px;}
.sj-count{font-size:11px;color:#aaa;margin-left:auto;}
.sj-upload-btn{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid #534AB755;color:#534AB7;background:#f0efff;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.sj-upload-btn:hover{background:#e4e2ff;}
.sj-dl-btn{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid #1D9E7555;color:#1D9E75;background:#f0faf6;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.sj-dl-btn:hover{background:#e0f5ec;}
.sj-table-wrap{flex:1;overflow:auto;}
.sj-table{width:100%;border-collapse:collapse;font-size:12px;}
.sj-table th{position:sticky;top:0;background:#fafafa;padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid #e5e5e5;white-space:nowrap;cursor:pointer;user-select:none;}
.sj-table th:hover{color:#534AB7;}.sj-table th.sort-asc::after{content:' ↑';}.sj-table th.sort-desc::after{content:' ↓';}
.sj-table td{padding:7px 10px;border-bottom:1px solid #f5f5f5;color:#333;vertical-align:middle;white-space:nowrap;}
.sj-table tr:hover td{background:#f9f9ff;}.sj-table tr.sj-selected td{background:#f0efff;}
.sj-chk{width:15px;height:15px;accent-color:#534AB7;cursor:pointer;}
.sj-empty{text-align:center;color:#aaa;font-size:12px;padding:60px 16px;}
.grade-pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;}
.grade-a{background:#d1f5e8;color:#085041;}.grade-b{background:#daeaf8;color:#0C447C;}.grade-c{background:#f0f0f0;color:#666;}
.vgrade-pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:8px;background:#f0efff;color:#534AB7;}
.egrade-pill{display:inline-block;font-size:10px;font-weight:600;padding:2px 6px;border-radius:8px;background:#e8f5e9;color:#2e7d32;}
.caution-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#EF9F27;}
.creator-grades{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap;}
.cg-pill{font-size:9px;font-weight:600;padding:1px 5px;border-radius:6px;}
.grade-edit-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5;}
.grade-edit-label{font-size:11px;color:#888;width:130px;flex-shrink:0;}
.grade-edit-select{font-size:12px;padding:4px 8px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;outline:none;}
</style>
</head>
<body>
<div class="app">
  <div class="campaign-bar">
    <span class="campaign-bar-label">Campaign</span>
    <div class="campaign-select-wrap">
      <select id="campaignSelect" onchange="switchCampaign(this.value)"><option value="">— select —</option></select>
      <i class="ti ti-chevron-down"></i>
    </div>
    <button class="bar-btn new" onclick="openPanel('newcampaign')"><i class="ti ti-plus"></i> New</button>
    <div class="bar-spacer"></div>
    <button class="bar-btn" onclick="openPanel('creators')"><i class="ti ti-users"></i> Creators</button>
    <button class="bar-btn" onclick="openPanel('howto')"><i class="ti ti-help-circle"></i> How to use</button>
    <button class="bar-btn" onclick="openPanel('backup')" style="border-color:#534AB755;color:#534AB7;background:#f0efff;"><i class="ti ti-database-export"></i> Backup</button>
    <button class="bar-btn" onclick="openPanel('savesetup')"><i class="ti ti-settings"></i> Save settings</button>
    <div class="bar-btn danger" onclick="deleteCampaign()" id="delCampaignBtn" style="display:none"><i class="ti ti-trash"></i></div>
  </div>

  <div class="body-wrap">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="header-actions">
          <button class="hbtn" onclick="openPanel('csv')"><i class="ti ti-upload"></i> Import</button>
          <button class="hbtn" onclick="openPanel('master')"><i class="ti ti-adjustments-horizontal"></i> Master</button>
          <button class="hbtn" style="border-color:#1a1a1a33;color:#1a1a1a;" onclick="openPanel('loadgithub')"><i class="ti ti-brand-github"></i> Load</button>
        </div>
      </div>
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input id="searchInput" type="text" placeholder="Search creator..." oninput="filterCreators(this.value)"/>
      </div>
      <div class="creator-list" id="creatorList">
        <div class="empty-msg" id="noCreators">Create or select a campaign first</div>
      </div>
      <div class="empty-msg" id="noSearch" style="display:none;">No creators found</div>
    </div>

    <div class="main">
      <div class="main-header">
        <div>
          <div class="main-title" id="mainTitle">No campaign selected</div>
          <div class="main-sub" id="mainSub">Create a new campaign to get started</div>
        </div>
        <div class="main-header-right">
          <button class="feedback-btn" id="feedbackBtn" style="display:none" onclick="openPanel('feedback')"><i class="ti ti-message-2"></i> Feedback</button>
          <div class="sbadge" id="sbadge" style="display:none" onclick="cycleStatus()"></div>
        </div>
      </div>
      <div class="main-tabs" id="mainTabs" style="display:none">
        <button class="main-tab" data-tab="sunjeong" onclick="switchMainTab('sunjeong')"><i class="ti ti-users-group" style="font-size:11px;margin-right:3px;"></i>선정</button>
        <button class="main-tab active" data-tab="check" onclick="switchMainTab('check')"><i class="ti ti-checklist" style="font-size:11px;margin-right:3px;"></i>Check</button>
      </div>
      <div class="sunjeong-area" id="sunjeongArea" style="display:none"></div>
      <div class="checklist-area" id="checklistArea">
        <div style="color:#aaa;font-size:12px;margin-top:80px;text-align:center;line-height:2.4;">
          <i class="ti ti-layout-kanban" style="font-size:24px;display:block;margin-bottom:8px;"></i>
          Click <strong>+ New</strong> to get started
        </div>
      </div>
      <div class="footer">
        <span class="ftext" id="ftext">-- / -- items</span>
        <div class="pbar-wrap"><div class="pbar-fill" id="pbarFill" style="width:0%"></div></div>
        <span class="save-status" id="saveStatus"></span>
        <button class="fbtn" onclick="openPanel('export')"><i class="ti ti-download"></i> Export</button>
        <button class="fbtn" onclick="saveToLocalStorage()" style="border-color:#534AB755;color:#534AB7;background:#f0efff;"><i class="ti ti-device-floppy"></i> Save locally</button>
        <button class="fbtn gs-save" id="sheetsSaveBtn" onclick="saveToSheets()" style="display:none"><i class="ti ti-table"></i> Save</button>
        <button class="fbtn gh-save" id="githubSaveBtn" onclick="saveToGitHub()" style="display:none"><i class="ti ti-brand-github"></i> Save</button>
        <button class="fbtn" id="setupSaveBtn" onclick="openPanel('savesetup')" style="display:none"><i class="ti ti-settings"></i> Set up save</button>

    </div>

<script>
const AVC=["#e8e6ff","#d1f5e8","#fde8d8","#fce4ef","#daeaf8","#e5f5ce","#fff3d6","#fde8f0"];
const AVT=["#534AB7","#085041","#712B13","#72243E","#0C447C","#27500A","#7a5200","#7a1a3a"];
const STATUSES=["Pending Review","In Review","Revision Requested","Approved"];
const SCOL={"Pending Review":"#888","In Review":"#378ADD","Revision Requested":"#EF9F27","Approved":"#1D9E75"};

let campaigns={},activeCampaignId=null,activeCreatorId=null;
let ghToken="",ghRepo="cilla-nuri/campaign-checklist";
let sheetsId="",sheetsApiKey="",appsScriptUrl="";
let idc=500;
let hasUnsavedChanges=false;

function uid(){return"u"+(++idc);}
function getCampaign(){return activeCampaignId?campaigns[activeCampaignId]:null;}

/* ---- localStorage persistence ---- */
const LS_KEY="campaignChecklist_v1";

function saveToLocalStorage(){
  try{
    const data={
      campaigns:campaigns,
      activeCampaignId:activeCampaignId,
      ghToken:ghToken,
      ghRepo:ghRepo,
      sheetsId:sheetsId,
      sheetsApiKey:sheetsApiKey,
      appsScriptUrl:appsScriptUrl,
      idc:idc,
      savedAt:new Date().toISOString()
    };
    localStorage.setItem(LS_KEY,JSON.stringify(data));
    hasUnsavedChanges=false;
    showLocalSaveToast();
  }catch(e){console.warn("localStorage save failed",e);}
}

function loadFromLocalStorage(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw)return false;
    const data=JSON.parse(raw);
    if(data.campaigns)campaigns=data.campaigns;
    if(data.activeCampaignId)activeCampaignId=data.activeCampaignId;
    if(data.ghToken)ghToken=data.ghToken;
    if(data.ghRepo)ghRepo=data.ghRepo;
    if(data.sheetsId)sheetsId=data.sheetsId;
    if(data.sheetsApiKey)sheetsApiKey=data.sheetsApiKey;
    if(data.appsScriptUrl)appsScriptUrl=data.appsScriptUrl;
    if(data.idc)idc=data.idc;
    return true;
  }catch(e){return false;}
}

function markChanged(){
  hasUnsavedChanges=true;
}

function showLocalSaveToast(){
  let toast=document.getElementById("lsToast");
  if(!toast){
    toast=document.createElement("div");
    toast.id="lsToast";
    toast.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:11px;padding:7px 16px;border-radius:20px;z-index:9999;opacity:0;transition:opacity 0.2s;pointer-events:none;";
    document.body.appendChild(toast);
  }
  toast.textContent="Progress saved locally";
  toast.style.opacity="1";
  setTimeout(function(){toast.style.opacity="0";},1800);
}

/* ---- Auto-save on visibility change & interval ---- */
function autoSave(){
  if(hasUnsavedChanges)saveToLocalStorage();
}
setInterval(autoSave,30000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")autoSave();});

/* ---- Before close prompt ---- */
window.addEventListener("beforeunload",function(e){
  if(hasUnsavedChanges){
    saveToLocalStorage();
  }
});

/* ---- Init on load ---- */
window.addEventListener("DOMContentLoaded",function(){
  const restored=loadFromLocalStorage();
  if(restored){
    refreshCampaignSelect();
    if(activeCampaignId&&campaigns[activeCampaignId]){
      document.getElementById("delCampaignBtn").style.display="flex";
      renderSidebar();resetMainPanel();
      document.getElementById("mainTabs").style.display="flex";
      var _c=getCampaign();
      if(_c&&_c.creators.length){loadCreatorGrades(_c.creators.map(function(cr){return cr.handle;})).then(function(){renderSidebar();});}
    }else{
      activeCampaignId=null;resetUI();
    }
    updateSaveButtons();
    if(Object.keys(campaigns).length>0){
      showLocalSaveToast();
      const t=document.getElementById("lsToast");
      if(t)t.textContent="Session restored!";
    }
  }
});

function nowStr(){
  const d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function pad(n){return String(n).padStart(2,"0");}
function dateStr(){const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}

function updateSaveButtons(){
  const hasGH=!!ghToken,hasSheets=!!(sheetsId&&sheetsApiKey)||!!appsScriptUrl,hasAny=hasGH||hasSheets;
  document.getElementById("githubSaveBtn").style.display=hasGH?"flex":"none";
  document.getElementById("sheetsSaveBtn").style.display=hasSheets?"flex":"none";
  document.getElementById("setupSaveBtn").style.display=(!hasAny&&!!activeCreatorId)?"flex":"none";
}

function newCampaign(name){const id=uid();campaigns[id]={id,name,creators:[],master:[],state:{}};return id;}

function refreshCampaignSelect(){
  const sel=document.getElementById("campaignSelect");
  sel.innerHTML='<option value="">-- select --</option>'+Object.keys(campaigns).map(id=>'<option value="'+id+'"'+(id===activeCampaignId?' selected':'')+'>'+campaigns[id].name+'</option>').join('');
}

function switchCampaign(id){
  if(!id){activeCampaignId=null;resetUI();document.getElementById("mainTabs").style.display="none";return;}
  activeCampaignId=id;activeCreatorId=null;
  document.getElementById("searchInput").value="";
  document.getElementById("delCampaignBtn").style.display="flex";
  document.getElementById("mainTabs").style.display="flex";
  renderSidebar();resetMainPanel();
  var c=getCampaign();
  if(c&&c.creators.length){loadCreatorGrades(c.creators.map(function(cr){return cr.handle;})).then(function(){renderSidebar();});}
}

function deleteCampaign(){
  if(!activeCampaignId)return;
  if(!confirm('Delete "'+campaigns[activeCampaignId].name+'"?'))return;
  delete campaigns[activeCampaignId];activeCampaignId=null;activeCreatorId=null;
  document.getElementById("delCampaignBtn").style.display="none";
  refreshCampaignSelect();resetUI();
}

function resetUI(){
  document.getElementById("mainTitle").textContent="No campaign selected";
  document.getElementById("mainSub").textContent="Create a new campaign to get started";
  document.getElementById("sbadge").style.display="none";document.getElementById("feedbackBtn").style.display="none";
  document.getElementById("checklistArea").innerHTML='<div style="color:#aaa;font-size:12px;margin-top:80px;text-align:center;line-height:2.4;"><i class="ti ti-layout-kanban" style="font-size:24px;display:block;margin-bottom:8px;"></i>Click <strong>+ New</strong> to get started</div>';
  document.getElementById("ftext").textContent="-- / -- items";document.getElementById("pbarFill").style.width="0%";
  document.getElementById("creatorList").innerHTML='<div class="empty-msg" id="noCreators">Create or select a campaign first</div>';
  document.getElementById("noSearch").style.display="none";document.getElementById("saveStatus").textContent="";
  updateSaveButtons();
}

function resetMainPanel(){
  activeCreatorId=null;
  const c=getCampaign();
  document.getElementById("mainTitle").textContent=c?c.name:"No campaign selected";
  document.getElementById("mainSub").textContent=c?(c.creators.length+" creators / "+c.master.reduce(function(a,s){return a+s.items.length;},0)+" checklist items"):"";
  document.getElementById("sbadge").style.display="none";document.getElementById("feedbackBtn").style.display="none";
  document.getElementById("checklistArea").innerHTML='<div style="color:#aaa;font-size:12px;margin-top:80px;text-align:center;line-height:2.2;"><i class="ti ti-users" style="font-size:24px;display:block;margin-bottom:8px;"></i>'+(c&&c.creators.length?"Select a creator from the sidebar":"Import creators via CSV and load checklist via Master")+'</div>';
  document.getElementById("ftext").textContent="-- / -- items";document.getElementById("pbarFill").style.width="0%";
  document.getElementById("saveStatus").textContent="";updateSaveButtons();
}

function buildState(){
  const c=getCampaign();if(!c)return;
  c.creators.forEach(function(cr){
    if(!c.state[cr.id])c.state[cr.id]={status:"Pending Review",checks:{},savedAt:null};
    const ex=c.state[cr.id].checks,nc={};
    c.master.forEach(function(s){s.items.forEach(function(it){nc[it.id]=ex[it.id]||false;});});
    c.state[cr.id].checks=nc;
  });
}

function initials(n){return n.split(" ").map(function(w){return w[0]||"";}).join("").toUpperCase().slice(0,2);}

function renderSidebar(){
  const c=getCampaign();const list=document.getElementById("creatorList");
  if(!c||!c.creators.length){list.innerHTML='<div class="empty-msg" id="noCreators">Import a CSV to load creators</div>';return;}
  list.innerHTML=c.creators.map(function(cr,i){
    var g=getCreatorGrade(cr.handle);var gb=g?((g.video_quality&&!g.cant_evaluate?'<span class="cg-pill" style="background:#f0efff;color:#534AB7;">'+g.video_quality+'</span>':'')+(g.manager_evaluation&&!g.cant_evaluate?'<span class="cg-pill" style="background:#e8f5e9;color:#2e7d32;">'+g.manager_evaluation+'</span>':'')+(g.blacklist?'<span class="cg-pill" style="background:#fde8d8;color:#712B13;">BL</span>':'')):''; 
    return '<div class="creator-item'+(cr.id===activeCreatorId?' active':'')+'" id="ci-'+cr.id+'" onclick="selectCreator(\''+cr.id+'\')">'+
      '<div class="avatar" style="background:'+AVC[i%AVC.length]+';color:'+AVT[i%AVT.length]+'">'+initials(cr.nick)+'</div>'+
      '<div class="creator-info"><div class="creator-handle">'+cr.handle+'</div><div class="creator-nick">#'+cr.applyNum+' - '+cr.nick+'</div>'+(gb?'<div class="creator-grades">'+gb+'</div>':'')+'</div>'+
      '<div class="ppill" id="pp-'+cr.id+'">'+getPct(c,cr.id)+'%</div></div>';
  }).join('');
  updateAllPills();
}

function getPct(c,id){
  if(!c.state[id])return 0;
  const ch=c.state[id].checks,total=Object.keys(ch).length,done=Object.values(ch).filter(Boolean).length;
  return total?Math.round(done/total*100):0;
}

function filterCreators(q){
  const c=getCampaign();if(!c)return;
  q=q.trim().toLowerCase();let vis=0;
  c.creators.forEach(function(cr){
    const el=document.getElementById("ci-"+cr.id);if(!el)return;
    const match=!q||cr.handle.toLowerCase().includes(q)||cr.nick.toLowerCase().includes(q)||cr.applyNum.includes(q);
    el.classList.toggle("hidden",!match);
    if(match){vis++;el.querySelector(".creator-handle").innerHTML=hl(cr.handle,q);el.querySelector(".creator-nick").innerHTML=hl("#"+cr.applyNum+" - "+cr.nick,q);}
    else{el.querySelector(".creator-handle").textContent=cr.handle;el.querySelector(".creator-nick").textContent="#"+cr.applyNum+" - "+cr.nick;}
  });
  document.getElementById("noSearch").style.display=(vis===0&&c.creators.length>0)?"block":"none";
}

function hl(t,q){
  if(!q)return t;
  return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");
}

function selectCreator(id){
  const c=getCampaign();if(!c)return;
  activeCreatorId=id;
  document.querySelectorAll(".creator-item").forEach(function(e){e.classList.remove("active");});
  const el=document.getElementById("ci-"+id);if(el)el.classList.add("active");
  const cr=c.creators.find(function(x){return x.id===id;});
  document.getElementById("mainTitle").textContent=cr.nick;
  document.getElementById("mainSub").textContent=cr.handle+" / Apply #"+cr.applyNum+" / "+c.name;
  document.getElementById("sbadge").style.display="block";document.getElementById("feedbackBtn").style.display="flex";
  const saved=c.state[id]&&c.state[id].savedAt;
  document.getElementById("saveStatus").textContent=saved?"Saved: "+saved:"";
  renderBadge();renderChecklist();updateSaveButtons();
}

function renderBadge(){
  const c=getCampaign();if(!c||!activeCreatorId)return;
  const s=c.state[activeCreatorId].status,b=document.getElementById("sbadge");
  b.textContent=s;b.style.color=SCOL[s];b.style.borderColor=SCOL[s]+"55";b.style.background=SCOL[s]+"18";
}

function cycleStatus(){
  const c=getCampaign();if(!c||!activeCreatorId)return;
  c.state[activeCreatorId].status=STATUSES[(STATUSES.indexOf(c.state[activeCreatorId].status)+1)%STATUSES.length];
  renderBadge();markChanged();
}

function renderChecklist(){
  const c=getCampaign();if(!c||!activeCreatorId)return;
  const checks=c.state[activeCreatorId].checks;let html="";
  c.master.forEach(function(s){
    if(!s.items.length)return;
    html+='<div class="sec-label">'+s.name+'</div>';
    s.items.forEach(function(it){
      const done=checks[it.id];
      html+='<div class="chk-item" onclick="toggle(\''+activeCreatorId+'\',\''+it.id+'\')"><div class="chk-box'+(done?" on":"")+'"><i class="ti ti-check chk-ic"></i></div><span class="chk-lbl'+(done?" done":"")+'">'+it.text+'</span></div>';
    });
  });
  if(!html)html='<div style="color:#aaa;font-size:12px;margin-top:40px;text-align:center;">No checklist items -- import via Master.</div>';
  document.getElementById("checklistArea").innerHTML=html;updateFooter();
}

function toggle(creatorId,iid){
  const c=getCampaign();if(!c)return;
  c.state[creatorId].checks[iid]=!c.state[creatorId].checks[iid];
  renderChecklist();updatePill(creatorId);markChanged();
}

function updateFooter(){
  const c=getCampaign();if(!c||!activeCreatorId)return;
  const ch=c.state[activeCreatorId].checks;
  const total=Object.keys(ch).length,done=Object.values(ch).filter(Boolean).length;
  document.getElementById("ftext").textContent=done+" / "+total+" items";
  document.getElementById("pbarFill").style.width=(total?Math.round(done/total*100):0)+"%";
}

function updatePill(id){
  const c=getCampaign();if(!c)return;
  const pct=getPct(c,id);const p=document.getElementById("pp-"+id);if(!p)return;
  p.textContent=pct+"%";
  if(pct===100){p.style.background="#1D9E7520";p.style.color="#1D9E75";}
  else if(pct>0){p.style.background="#378ADD20";p.style.color="#378ADD";}
  else{p.style.background="#f0f0f0";p.style.color="#aaa";}
}
function updateAllPills(){const c=getCampaign();if(!c)return;c.creators.forEach(function(cr){updatePill(cr.id);});}

function getMissingItems(){
  const c=getCampaign();if(!c||!activeCreatorId)return[];
  const checks=c.state[activeCreatorId].checks,missing=[];
  c.master.forEach(function(s){s.items.forEach(function(it){if(!checks[it.id])missing.push(it.text);});});
  return missing;
}

/* ---- GitHub Save ---- */
/* ---- Helper: save a single file to GitHub ---- */
async function ghPut(filepath, content, message){
  const encoded=btoa(unescape(encodeURIComponent(content)));
  // Always fetch fresh SHA before writing
  let sha=null;
  try{
    const check=await fetch("https://api.github.com/repos/"+ghRepo+"/contents/"+filepath,{
      headers:{"Authorization":"token "+ghToken,"Accept":"application/vnd.github.v3+json"},
      cache:"no-store"
    });
    if(check.ok){const d=await check.json();sha=d.sha;}
  }catch(e){}
  const body={message:message,content:encoded};
  if(sha)body.sha=sha;
  const res=await fetch("https://api.github.com/repos/"+ghRepo+"/contents/"+filepath,{
    method:"PUT",
    headers:{"Authorization":"token "+ghToken,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  // If 409 conflict, fetch SHA again and retry once
  if(res.status===409){
    try{
      const check2=await fetch("https://api.github.com/repos/"+ghRepo+"/contents/"+filepath,{
        headers:{"Authorization":"token "+ghToken,"Accept":"application/vnd.github.v3+json"},
        cache:"no-store"
      });
      if(check2.ok){
        const d2=await check2.json();
        const body2={message:message,content:encoded,sha:d2.sha};
        const res2=await fetch("https://api.github.com/repos/"+ghRepo+"/contents/"+filepath,{
          method:"PUT",
          headers:{"Authorization":"token "+ghToken,"Accept":"application/vnd.github.v3+json","Content-Type":"application/json"},
          body:JSON.stringify(body2)
        });
        return res2.ok;
      }
    }catch(e){}
    return false;
  }
  return res.ok;
}

/* ---- Save campaign meta (info + creators + master) to GitHub ---- */
async function saveCampaignMeta(c){
  const campSlug=c.name.replace(/[^a-zA-Z0-9]/g,"_").toLowerCase();
  const now=nowStr();
  // 1. Campaign info
  const infoContent="Campaign Name: "+c.name+"\nSlug: "+campSlug+"\nLastUpdated: "+now+"\n";
  await ghPut("reviews/"+campSlug+"/_campaign_info.txt",infoContent,"Campaign info: "+c.name);
  // 2. Creator list
  const creatorLines=["apply_num,handle,nick"].concat(c.creators.map(function(cr){return cr.applyNum+","+cr.handle+","+cr.nick;}));
  await ghPut("reviews/"+campSlug+"/_creators.csv",creatorLines.join("\n"),"Creators: "+c.name);
  // 3. Master checklist
  const masterLines=["section,item"];
  c.master.forEach(function(sec){sec.items.forEach(function(it){masterLines.push('"'+sec.name+'","'+it.text.replace(/"/g,'""')+'"');});});
  await ghPut("reviews/"+campSlug+"/_master.csv",masterLines.join("\n"),"Master checklist: "+c.name);
}

async function saveToGitHub(){
  if(!ghToken){openPanel("savesetup");return;}
  const c=getCampaign();if(!activeCreatorId||!c){alert("Select a creator first.");return;}
  const cr=c.creators.find(function(x){return x.id===activeCreatorId;});
  const s=c.state[activeCreatorId];
  const now=nowStr(),date=dateStr();
  const campSlug=c.name.replace(/[^a-zA-Z0-9]/g,"_").toLowerCase();
  const crSlug=cr.handle.replace("@","").replace(/[^a-zA-Z0-9]/g,"_");
  const filename="reviews/"+campSlug+"/"+date+"_"+crSlug+".txt";
  const total=Object.keys(s.checks).length,done=Object.values(s.checks).filter(Boolean).length;
  const pct=total?Math.round(done/total*100):0;
  let content="Campaign: "+c.name+"\nCreator: "+cr.nick+" ("+cr.handle+")\nApply #: "+cr.applyNum+"\nStatus: "+s.status+"\nProgress: "+done+"/"+total+" ("+pct+"%)\nSaved: "+now+"\n\n";
  c.master.forEach(function(sec){
    content+="== "+sec.name+" ==\n";
    sec.items.forEach(function(it){content+=(s.checks[it.id]?"[x] ":"[ ] ")+it.text+"\n";});
    content+="\n";
  });
  const missing=getMissingItems();
  if(missing.length){content+="== Missing ("+missing.length+") ==\n";missing.forEach(function(m,i){content+=(i+1)+". "+m+"\n";});}
  const btn=document.getElementById("githubSaveBtn");
  btn.innerHTML='<i class="ti ti-loader"></i> Saving...';btn.disabled=true;
  try{
    // Save campaign meta FIRST, then review file (sequential to avoid 409 conflicts)
    await saveCampaignMeta(c);
    const ok=await ghPut(filename,content,"Review: "+cr.nick+" - "+c.name+" ["+now+"]");
    if(ok){

async function loadFromGitHub(){
  const c=getCampaign();if(!c)return;
  const btn=document.getElementById("loadGHBtn");
  const status=document.getElementById("ghLoadStatus");
  btn.disabled=true;btn.textContent="Loading...";
  status.innerHTML='<i class="ti ti-loader" style="font-size:20px;display:block;margin-bottom:8px;color:#aaa;"></i>Loading from repo...';
  const campSlug=c.name.replace(/[^a-zA-Z0-9]/g,"_").toLowerCase();
  const folderPath="reviews/"+campSlug;
  try{
    const res=await fetch("https://api.github.com/repos/"+ghRepo+"/contents/"+folderPath,{headers:{"Authorization":"token "+ghToken,"Accept":"application/vnd.github.v3+json"}});
    if(!res.ok){
      status.innerHTML='<div style="color:#e24b4a;">No data found for this campaign.<br><small>Looking for: reviews/'+campSlug+'/</small></div>';
      btn.disabled=false;btn.innerHTML='<i class="ti ti-download"></i> Load';return;
    }
    const files=await res.json();
    var loaded=[];

    // 1. Load creators from _creators.csv
    const creatorFile=files.find(function(f){return f.name==="_creators.csv";});
    if(creatorFile){
      const cr=await fetch(creatorFile.download_url);
      const txt=await cr.text();
      const lines=txt.split(/\r?\n/).filter(function(l){return l.trim();});
      if(lines.length>1){
        const newCreators=[];
        for(var i=1;i<lines.length;i++){
          const cols=lines[i].split(",");
          if(cols.length<3)continue;
          const existing=c.creators.find(function(x){return x.handle.toLowerCase()===cols[1].trim().toLowerCase();});
          if(!existing){
            newCreators.push({id:uid(),applyNum:cols[0].trim(),handle:cols[1].trim(),nick:cols[2].trim()});
          }
        }
        if(newCreators.length){c.creators=c.creators.concat(newCreators);}
        loaded.push(c.creators.length+" creators");
      }
    }

    // 2. Load master checklist from _master.csv
    const masterFile=files.find(function(f){return f.name==="_master.csv";});
    if(masterFile&&!c.master.length){
      const mf=await fetch(masterFile.download_url);
      const mtxt=await mf.text();
      const mlines=mtxt.split(/\r?\n/).filter(function(l){return l.trim();});
      if(mlines.length>1){
        const sections={},order=[];
        for(var j=1;j<mlines.length;j++){
          const cols=mlines[j].split(",").map(function(v){return v.trim().replace(/^"|"$/g,"");});
          if(cols.length<2)continue;
          const sec=cols[0],item=cols[1];
          if(!sections[sec]){sections[sec]=[];order.push(sec);}
          sections[sec].push(item);
        }
        c.master=order.map(function(sec){return {id:uid(),name:sec,items:sections[sec].map(function(txt){return {id:uid(),text:txt};})};});
        loaded.push(c.master.reduce(function(a,s){return a+s.items.length;},0)+" checklist items");
      }
    }

    // 3. Rebuild state with new creators/master
    buildState();

    // 4. Load review progress from .txt files
    const txts=files.filter(function(f){return f.name.endsWith(".txt")&&!f.name.startsWith("_");});
    let restored=0,skipped=0;
    for(var k=0;k<txts.length;k++){
      var file=txts[k];
      const fRes=await fetch(file.download_url);
      const text=await fRes.text();
      const handleMatch=text.match(/Creator:[^\(]*\((@[^\)]+)\)/);
      const statusMatch=text.match(/Status:\s*(.+)/);
      if(!handleMatch){skipped++;continue;}
      const handle=handleMatch[1].toLowerCase();
      const cr=c.creators.find(function(x){return x.handle.toLowerCase()===handle;});
      if(!cr){skipped++;continue;}
      if(!c.state[cr.id])c.state[cr.id]={status:"Pending Review",checks:{},savedAt:null};
      if(statusMatch){const sv=statusMatch[1].trim();if(STATUSES.indexOf(sv)>=0)c.state[cr.id].status=sv;}
      c.master.forEach(function(sec){
        sec.items.forEach(function(it){
          const safe=it.text.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
          const pat=new RegExp("\\[x\\]\\s+"+safe);
          if(pat.test(text))c.state[cr.id].checks[it.id]=true;
        });
      });
      const dateMatch=file.name.match(/^(\d{8})/);
      if(dateMatch){const dm=dateMatch[1];c.state[cr.id].savedAt=dm.slice(0,4)+"-"+dm.slice(4,6)+"-"+dm.slice(6,8);}
      restored++;
    }
    if(restored>0)loaded.push(restored+" review"+(restored>1?"s":"")+" restored");

    renderSidebar();resetMainPanel();updateAllPills();
    if(activeCreatorId){renderChecklist();renderBadge();}
    markChanged();saveToLocalStorage();

    const summary=loaded.length?loaded.join(" · "):"Nothing new to load";
    status.innerHTML='<div style="color:#1D9E75;font-size:12px;"><i class="ti ti-circle-check" style="font-size:18px;display:block;margin-bottom:6px;"></i>'+summary+'.'+(skipped>0?'<br><span style="font-size:11px;color:#aaa;">'+skipped+' review file(s) skipped (creator not in list)</span>':'')+'</div>';
    btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh"></i> Reload';
  }catch(e){
    status.innerHTML='<div style="color:#e24b4a;">Error loading. Check your token and repo name.</div>';
    btn.disabled=false;btn.innerHTML='<i class="ti ti-download"></i> Load';
  }
}

async function saveAllToGitHub(){
  const c=getCampaign();
  if(!c){alert("Please select a campaign first.");return;}
  if(!c.creators||!c.creators.length){alert("No creators in this campaign yet. Import a creator CSV first.");return;}
  if(!ghToken){openPanel("savesetup");return;}
  const pfWarn=document.getElementById("pfWarn");
  if(pfWarn){pfWarn.textContent="Saving all to GitHub...";pfWarn.style.color="#aaa";}
  // Save campaign meta first
  await saveCampaignMeta(c);
  let saved=0,failed=0;
  for(var i=0;i<c.creators.length;i++){
    var cr=c.creators[i];
    const s=c.state[cr.id];if(!s)continue;
    const now=nowStr(),date=dateStr();
    const campSlug=c.name.replace(/[^a-zA-Z0-9]/g,"_").toLowerCase();
    const crSlug=cr.handle.replace("@","").replace(/[^a-zA-Z0-9]/g,"_");
    const filename="reviews/"+campSlug+"/"+date+"_"+crSlug+".txt";
    const total=Object.keys(s.checks).length,done=Object.values(s.checks).filter(Boolean).length;
    const pct=total?Math.round(done/total*100):0;
    let content="Campaign: "+c.name+"\nCreator: "+cr.nick+" ("+cr.handle+")\nApply #: "+cr.applyNum+"\nStatus: "+s.status+"\nProgress: "+done+"/"+total+" ("+pct+"%)\nSaved: "+now+"\n\n";
    c.master.forEach(function(sec){content+="== "+sec.name+" ==\n";sec.items.forEach(function(it){content+=(s.checks[it.id]?"[x] ":"[ ] ")+it.text+"\n";});content+="\n";});
    const missing=c.master.reduce(function(a,sec){return a.concat(sec.items.filter(function(it){return !s.checks[it.id];}).map(function(it){return it.text;}));},[]); 
    if(missing.length){content+="== Missing ("+missing.length+") ==\n";missing.forEach(function(m,j){content+=(j+1)+". "+m+"\n";});}
    try{
      const ok=await ghPut(filename,content,"Review: "+cr.nick+" - "+c.name+" ["+now+"]");
      if(ok){s.savedAt=now;saved++;}else{failed++;}
    }catch(e){failed++;}
  }
  if(pfWarn){pfWarn.textContent=saved+" saved to GitHub"+(failed>0?" / "+failed+" failed":"");pfWarn.style.color=failed>0?"#EF9F27":"#1D9E75";}
}

function downloadFile(name,content,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type:type||"text/plain"}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}

function exportCSV(){
  const c=getCampaign();if(!c)return;
  const rows=[["Campaign","Creator","Handle","Apply #","Status","Progress %","Section","Item","Checked","Saved At"]];
  c.creators.forEach(function(cr){
    const s=c.state[cr.id];if(!s)return;
    const total=Object.keys(s.checks).length,done=Object.values(s.checks).filter(Boolean).length;
    const pct=total?Math.round(done/total*100):0;
    c.master.forEach(function(sec){sec.items.forEach(function(it){rows.push([c.name,cr.nick,cr.handle,cr.applyNum,s.status,pct+"%",sec.name,it.text,s.checks[it.id]?"Yes":"No",s.savedAt||""]);});});
  });
  downloadFile(c.name.replace(/[^a-zA-Z0-9]/g,"_")+"_"+dateStr()+".csv",rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(",");}).join("\n"),"text/csv");
  closePanel();
}

function saveSaveSettings(){
  const ghT=document.getElementById("ghTokenInput");
  const ghR=document.getElementById("ghRepoInput");
  const sUrl=document.getElementById("appsScriptUrlInput");
  const sId=document.getElementById("sheetsIdInput");
  const sKey=document.getElementById("sheetsApiKeyInput");
  if(ghT&&ghT.value.trim())ghToken=ghT.value.trim();
  if(ghR&&ghR.value.trim())ghRepo=ghR.value.trim();
  if(sUrl)appsScriptUrl=sUrl.value.trim();
  if(sId)sheetsId=sId.value.trim();
  if(sKey)sheetsApiKey=sKey.value.trim();
  // Force update localStorage directly to ensure token is saved
  try{
    const raw=localStorage.getItem(LS_KEY);
    const existing=raw?JSON.parse(raw):{};
    existing.ghToken=ghToken;
    existing.ghRepo=ghRepo;
    existing.appsScriptUrl=appsScriptUrl;
    existing.sheetsId=sheetsId;
    existing.sheetsApiKey=sheetsApiKey;
    existing.savedAt=new Date().toISOString();
    localStorage.setItem(LS_KEY,JSON.stringify(existing));
  }catch(e){}
  updateSaveButtons();
  const pf=document.getElementById("pfWarn");
  if(pf){pf.textContent="Settings saved!";pf.style.color="#1D9E75";}
  setTimeout(closePanel,800);
}

async function testGitHubToken(){
  const tokenInput=document.getElementById("ghTokenInput");
  const repoInput=document.getElementById("ghRepoInput");
  const token=tokenInput?tokenInput.value.trim():ghToken;
  const repo=repoInput?repoInput.value.trim():ghRepo;
  const btn=document.getElementById("testGHBtn");
  const pf=document.getElementById("pfWarn");
  if(!token){if(pf){pf.textContent="Please enter a token first.";pf.style.color="#e24b4a";}return;}
  if(btn){btn.disabled=true;btn.textContent="Testing...";}
  try{
    const res=await fetch("https://api.github.com/repos/"+repo+"/contents",{
      headers:{"Authorization":"token "+token,"Accept":"application/vnd.github.v3+json"}
    });
    if(res.ok){
      if(pf){pf.textContent="✓ Token works! Click Save.";pf.style.color="#1D9E75";}
    }else{
      const d=await res.json();
      if(pf){pf.textContent="Error: "+(d.message||"Invalid token");pf.style.color="#e24b4a";}
    }
  }catch(e){
    if(pf){pf.textContent="Network error";pf.style.color="#e24b4a";}
  }
  if(btn){btn.disabled=false;btn.textContent="Test connection";}
}

function handleCreatorCSV(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    const lines=e.target.result.split(/\r?\n/).filter(function(l){return l.trim();});
    if(lines.length<2){document.getElementById("pfWarn").textContent="CSV seems empty.";return;}
    const header=lines[0].split(",").map(function(h){return h.trim().toLowerCase().replace(/['"]/g,"");});
    const applyIdx=header.findIndex(function(h){return h.includes("apply")||h==="no"||h==="#"||h.includes("number");});
    const idIdx=header.findIndex(function(h){return h==="id"||h.includes("username")||h.includes("handle");});
    const nickIdx=header.findIndex(function(h){return h.includes("nick")||h.includes("name");});
    if(applyIdx<0||idIdx<0||nickIdx<0){document.getElementById("pfWarn").textContent="Could not detect columns.";return;}
    parsedCreators=[];var preview=[];
    for(var i=1;i<lines.length;i++){
      const cols=lines[i].split(",").map(function(c){return c.trim().replace(/^["']|["']$/g,"");});
      if(!cols[idIdx])continue;
      const cr={id:uid(),applyNum:cols[applyIdx]||String(i),handle:cols[idIdx].startsWith("@")?cols[idIdx]:"@"+cols[idIdx],nick:cols[nickIdx]||cols[idIdx]};
      parsedCreators.push(cr);if(preview.length<4)preview.push(cr);
    }
    const camp=getCampaign();
    const existingHandles=new Set((camp?camp.creators:[]).map(function(cr){return cr.handle.toLowerCase();}));
    const newOnes=parsedCreators.filter(function(cr){return !existingHandles.has(cr.handle.toLowerCase());});
    const dupCount=parsedCreators.length-newOnes.length;
    document.getElementById("csvPreview").innerHTML=
      '<div style="font-size:11px;color:#aaa;margin:8px 0 4px;">'+parsedCreators.length+' in file - <span style="color:#1D9E75;font-weight:500;">'+newOnes.length+' new</span>'+(dupCount>0?' - <span style="color:#EF9F27;">'+dupCount+' already exist (progress kept)</span>':'')+' </div>'+
      preview.map(function(cr){return '<div class="csv-row"><strong>#'+cr.applyNum+'</strong><span>'+cr.handle+'</span><span>'+cr.nick+'</span><span style="font-size:10px;color:'+(existingHandles.has(cr.handle.toLowerCase())?"#EF9F27":"#1D9E75")+'">'+(existingHandles.has(cr.handle.toLowerCase())?"existing":"new")+'</span></div>';}).join('')+
      (parsedCreators.length>4?'<div style="font-size:11px;color:#aaa;padding:4px 0;">+'+(parsedCreators.length-4)+' more</div>':"");
    const btn=document.getElementById("applyCSVBtn");btn.disabled=false;btn.style.opacity="1";
    document.getElementById("pfWarn").textContent="";
  };
  reader.readAsText(file);
}

function applyCreatorCSV(){
  if(!parsedCreators.length)return;const c=getCampaign();if(!c)return;
  const existingHandles=new Set(c.creators.map(function(cr){return cr.handle.toLowerCase();}));
  let added=0;
  parsedCreators.forEach(function(cr){
    if(!existingHandles.has(cr.handle.toLowerCase())){c.creators.push(cr);added++;}
  });
  buildState();renderSidebar();resetMainPanel();markChanged();saveToLocalStorage();
  const pf=document.getElementById("pfWarn");
  if(pf){pf.textContent=added>0?(added+" new creator"+(added>1?"s":"")+" added. Existing progress kept."):"No new creators -- all already in list.";pf.style.color=added>0?"#1D9E75":"#EF9F27";}
  setTimeout(closePanel,1800);
}

function handleChecklistCSV(file){
  if(!file)return;const reader=new FileReader();
  reader.onload=function(e){
    const lines=e.target.result.split(/\r?\n/).filter(function(l){return l.trim();});if(lines.length<2)return;
    const header=lines[0].split(",").map(function(h){return h.trim().toLowerCase().replace(/['"]/g,"");});
    const secIdx=header.findIndex(function(h){return h.includes("section")||h.includes("category")||h.includes("group");});
    const itemIdx=header.findIndex(function(h){return h.includes("item")||h.includes("check")||h.includes("task")||h.includes("text");});
    if(secIdx<0||itemIdx<0){document.getElementById("pfWarn").textContent="Need columns: section, item.";return;}
    const sections={},order=[];
    for(var i=1;i<lines.length;i++){
      const cols=lines[i].split(",").map(function(c){return c.trim().replace(/^["']|["']$/g,"");});
      const sec=cols[secIdx]||"General",item=cols[itemIdx];if(!item)continue;
      if(!sections[sec]){sections[sec]=[];order.push(sec);}sections[sec].push(item);
    }
    masterDraft=order.map(function(sec){return {id:uid(),name:sec,items:sections[sec].map(function(txt){return {id:uid(),text:txt};})};});
    const total=masterDraft.reduce(function(a,s){return a+s.items.length;},0);
    document.getElementById("checklistImportPreview").innerHTML='<div style="font-size:11px;color:#1D9E75;padding:6px 0;">'+total+' items across '+masterDraft.length+' sections -- review then Apply.</div>';
    document.getElementById("masterItems").innerHTML=masterDraft.map(renderSecBlock).join('');
    document.getElementById("pfWarn").textContent="";
  };
  reader.readAsText(file);
}

function updSecName(sid,v){const s=masterDraft.find(function(x){return x.id===sid;});if(s)s.name=v;}

function addItm(sid){

async function scanCampaignsFromGitHub(){
  if(!ghToken){openPanel("savesetup");return;}
  const btn=document.getElementById("scanBtn");
  const status=document.getElementById("scanStatus");
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader"></i> Scanning...';}
  if(status)status.innerHTML='';
  try{
    const res=await fetch("https://api.github.com/repos/"+ghRepo+"/contents/reviews",{
      headers:{"Authorization":"token "+ghToken,"Accept":"application/vnd.github.v3+json"}
    });
    if(!res.ok){
      if(status)status.innerHTML='<div style="color:#e24b4a;font-size:12px;">No reviews folder found yet. Save some reviews first!</div>';
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-radar"></i> Scan repo for campaigns';}
      return;
    }
    const folders=await res.json();
    const campFolders=folders.filter(function(f){return f.type==="dir";});
    if(!campFolders.length){
      if(status)status.innerHTML='<div style="color:#EF9F27;font-size:12px;">No campaign folders found inside reviews/.</div>';
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-radar"></i> Scan repo for campaigns';}
      return;
    }
    if(status)status.innerHTML='<div style="font-size:11px;color:#aaa;">Found '+campFolders.length+' folders, reading campaign names...</div>';
    let added=0,existing=0;
    for(var i=0;i<campFolders.length;i++){
      var folder=campFolders[i];
      var campName=null;
      // Try to read _campaign_info.txt for real name
      try{
        const infoRes=await fetch("https://api.github.com/repos/"+ghRepo+"/contents/reviews/"+folder.name+"/_campaign_info.txt",{
          headers:{"Authorization":"token "+ghToken,"Accept":"application/vnd.github.v3+json"}
        });
        if(infoRes.ok){
          const infoData=await infoRes.json();
          const infoText=decodeURIComponent(escape(atob(infoData.content.replace(/\n/g,""))));
          const nameMatch=infoText.match(/Campaign Name:\s*(.+)/);
          if(nameMatch)campName=nameMatch[1].trim();
        }
      }catch(e){}
      // Fallback: convert slug to readable name
      if(!campName)campName=folder.name.replace(/^_+|_+$/g,"").replace(/_+/g," ");
      // Check if already exists by slug match
      const slug=folder.name;
      const alreadyExists=Object.values(campaigns).find(function(c){
        return c.name.replace(/[^a-zA-Z0-9]/g,"_").toLowerCase()===slug;
      });
      if(!alreadyExists){
        const id=uid();
        campaigns[id]={id:id,name:campName,creators:[],master:[],state:{}};
        added++;
      }else{
        existing++;
      }
    }
    saveToLocalStorage();
    refreshCampaignSelect();
    var msg='';
    if(added>0)msg+='<span style="color:#1D9E75;font-weight:500;">'+added+' campaign'+(added>1?"s":"")+" added</span>";
    if(added>0&&existing>0)msg+=" · ";
    if(existing>0)msg+='<span style="color:#aaa;">'+existing+' already existed</span>';
    if(status)status.innerHTML='<div style="font-size:12px;margin-top:6px;">'+msg+'.<br><span style="font-size:11px;color:#aaa;">Select a campaign → <strong>Load</strong> to restore everything.</span></div>';
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-refresh"></i> Scan again';}
  }catch(e){
    if(status)status.innerHTML='<div style="color:#e24b4a;font-size:12px;">Error scanning. Check your token.</div>';
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-radar"></i> Scan repo for campaigns';}
  }
}

function handleBackupImport(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.campaigns||!Array.isArray(data.campaigns)){
        document.getElementById("backupImportStatus").innerHTML='<div style="color:#e24b4a;font-size:12px;margin-top:8px;">Invalid backup file.</div>';
        return;
      }
      let added=0,updated=0;
      data.campaigns.forEach(function(bc){
        const existing=Object.values(campaigns).find(function(c){return c.name===bc.name;});
        if(existing){
          existing.creators=bc.creators||existing.creators;
          existing.master=bc.master||existing.master;
          buildState();
          updated++;
        }else{
          const id=uid();
          campaigns[id]={id:id,name:bc.name,creators:bc.creators||[],master:bc.master||[],state:{}};
          activeCampaignId=id;
          buildState();
          added++;
        }
      });
      saveToLocalStorage();
      refreshCampaignSelect();
      if(activeCampaignId&&campaigns[activeCampaignId]){
        renderSidebar();resetMainPanel();
        document.getElementById("delCampaignBtn").style.display="flex";
      }
      document.getElementById("backupImportStatus").innerHTML=
        '<div style="color:#1D9E75;font-size:12px;margin-top:8px;"><i class="ti ti-circle-check"></i> '+
        (added>0?added+' campaign'+(added>1?"s":"")+" added":"")+
        (added>0&&updated>0?" · ":"")+
        (updated>0?updated+' campaign'+(updated>1?"s":"")+" updated":"")+
        '. Session saved!</div>';
    }catch(err){
      document.getElementById("backupImportStatus").innerHTML='<div style="color:#e24b4a;font-size:12px;margin-top:8px;">Could not read file. Make sure it is a valid backup.json.</div>';
    }
  };
  reader.readAsText(file);
}

async function loadCreatorGrades(handles){
  if(!handles||!handles.length)return;
  var usernames=[];

  handles.forEach(function(h){var k=h.replace(/^@/,"").toLowerCase();if(!seen[k]){seen[k]=1;usernames.push(k);}});

      var data=await sbFetch("creators?username=in.("+chunk.map(function(u){return '"'+u+'"';}).join(",")+")")

}

function getCreatorGrade(handle){

async function upsertCreatorGrade(username,fields){
  var key=username.replace(/^@/,"").toLowerCase();
  try{
    var res=await sbFetch("creators?username=eq."+encodeURIComponent(key),{
      method:"PATCH",prefer:"resolution=merge-duplicates,return=representation",
      body:JSON.stringify(fields)
    });
    if(!res||!res.length){
      await sbFetch("creators",{method:"POST",prefer:"resolution=merge-duplicates,return=representation",
        body:JSON.stringify(Object.assign({username:key},fields))});
    }
    creatorGradeCache[key]=Object.assign({},creatorGradeCache[key]||{},{username:key},fields);
    return true;
  }catch(e){console.error("Upsert:",e);return false;}
}

function buildSjTable(rows){
  var labels=["Apply #","Username","Nickname","Grade","V","E","Skintone","English","Nationality","TT Followers","TT Avg Views","IG Followers","IG Avg Views","Caution","Notes"];
  var keys=["_applyNum","username","nickname","grade","_vr","_er","_sk","_en","nationality","tiktok_followers","tiktok_avg_views","instagram_followers","instagram_avg_views","caution","_notes"];
  var th='<th style="width:32px;"><input type="checkbox" class="sj-chk" onchange="sjToggleAll(this.checked)"/></th>';
  labels.forEach(function(l,i){
    var k=keys[i];
    var sc=sjSortCol===k?(sjSortDir===1?"sort-asc":"sort-desc"):"";
    th+='<th class="'+sc+'" onclick="sjSort(\''+k+'\')">'+l+'</th>';
  });
  var tbody=rows.map(function(r){
    var g=getCreatorGrade(r.username)||{};
    var sel=sjSelected.has(r._applyNum);

    var bl=g.blacklist;
    var td='<td><input type="checkbox" class="sj-chk" '+(sel?"checked":"")
      +' onclick="event.stopPropagation();sjToggleRow(\''+r._applyNum+'\')"/></td>'
      +'<td>'+r._applyNum+'</td>'
      +'<td style="font-weight:500;'+(bl?"color:#e24b4a;":"")+'">'+(bl?"[BL] ":"")+r.username+'</td>'
      +'<td>'+(r.nickname||"")+'</td>'
      +'<td>'+(r.grade?'<span class="grade-pill '+gc+'">'+r.grade+'</span>':'-')+'</td>'
      +'<td>'+(g.video_quality?'<span class="vgrade-pill">'+g.video_quality+'</span>':'-')+'</td>'
      +'<td>'+(g.manager_evaluation?'<span class="egrade-pill">'+g.manager_evaluation+'</span>':'-')+'</td>'
      +'<td>'+(g.skintone||'-')+'</td>'
      +'<td>'+(g.english_proficiency||'-')+'</td>'
      +'<td>'+(r.nationality||'-')+'</td>'
      +'<td>'+fmtNum(r.tiktok_followers)+'</td>'
      +'<td>'+fmtNum(r.tiktok_avg_views)+'</td>'
      +'<td>'+fmtNum(r.instagram_followers)+'</td>'
      +'<td>'+fmtNum(r.instagram_avg_views)+'</td>'
      +'<td>'+(r.caution&&r.caution.toUpperCase()!=="N"?'<span class="caution-dot"></span> '+r.caution:'-')+'</td>'
      +'<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;" title="'+(g.notes_manager||"")+'">'+(g.notes_manager||"")+'</td>';
    return '<tr class="'+(sel?"sj-selected":"")+'" onclick="sjRowClick(event,\''+r._applyNum+'\')">'+td+'</tr>';
  }).join("");

function fmtNum(v){if(!v||isNaN(v))return"-";var n=parseFloat(v);if(n>=1000000)return(n/1000000).toFixed(1)+"M";if(n>=1000)return(n/1000).toFixed(1)+"K";return Math.round(n).toLocaleString();}
function sjRowClick(e,id){if(e.target.tagName==="INPUT")return;sjToggleRow(id);}
function sjToggleRow(id){if(sjSelected.has(id))sjSelected.delete(id);else sjSelected.add(id);renderSjTable();}
function sjToggleAll(checked){getSjFiltered().forEach(function(r){checked?sjSelected.add(r._applyNum):sjSelected.delete(r._applyNum);});renderSjTable();}

function sjSort(col){
  if(sjSortCol===col)sjSortDir*=-1;else{sjSortCol=col;sjSortDir=1;}
  var numC=["tiktok_followers","tiktok_avg_views","instagram_followers","instagram_avg_views","_applyNum"];
  sjApplicants.sort(function(a,b){
    var ga=getCreatorGrade(a.username)||{},gb=getCreatorGrade(b.username)||{};
    var map={"_vr":"video_quality","_er":"manager_evaluation","_sk":"skintone","_en":"english_proficiency","_notes":"notes_manager"};
    var va=map[col]?ga[map[col]]||"":a[col]||"";
    var vb=map[col]?gb[map[col]]||"":b[col]||"";
    if(numC.includes(col)){return((parseFloat(va)||0)-(parseFloat(vb)||0))*sjSortDir;}
    return String(va).localeCompare(String(vb))*sjSortDir;
  });
  renderSjTable();
}

function handleSjCSV(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=async function(e){
    var lines=e.target.result.split(/\r?\n/).filter(function(l){return l.trim();});
    if(lines.length<2)return;
    var header=lines[0].split(",").map(function(h){return h.trim().replace(/^["']+|["']+$/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");});
    function col(){var names=Array.from(arguments);return header.findIndex(function(h){return names.some(function(n){return h.includes(n);});});}
    var ai=col("applynumber","applynum","apply"),ii=col("idusername","username","id"),ni=col("nickname","nick");
    var gi=col("grade"),tfi=col("tiktokfollowers"),tai=col("tiktokavgviews"),ifi=col("instagramfollowers"),iai=col("instagramavgviews"),nti=col("nationality"),ci=col("caution");
    sjApplicants=[];
    for(var i=1;i<lines.length;i++){
      var cols=splitCSVLine(lines[i]);
      var uname=(cols[ii]||"").replace(/^@/,"");
      if(!uname)continue;
      sjApplicants.push({_applyNum:cols[ai]||String(i),username:"@"+uname,nickname:cols[ni]||"",grade:(cols[gi]||"").toUpperCase(),tiktok_followers:cols[tfi]||"",tiktok_avg_views:cols[tai]||"",instagram_followers:cols[ifi]||"",instagram_avg_views:cols[iai]||"",nationality:cols[nti]||"",caution:cols[ci]||""});
    }
    await loadCreatorGrades(sjApplicants.map(function(r){return r.username;}));
    sjSelected=new Set();
    renderSunjeongArea();
  };
  reader.readAsText(file);
}

function splitCSVLine(line){
  var result=[],cur="",inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){inQ=!inQ;}
    else if(ch===","&&!inQ){result.push(cur.trim());cur="";}
    else cur+=ch;
  }
  result.push(cur.trim());
  return result;
}

function downloadSjSelected(){
  var sel=sjApplicants.filter(function(r){return sjSelected.has(r._applyNum);});
  if(!sel.length){alert("No creators selected!");return;}
  var hdrs=["Apply Number","Username","Nickname","Grade","V Rating","E Rating","Skintone","English","Nationality","TikTok Followers","TikTok Avg Views","IG Followers","IG Avg Views","Caution","Notes"];
  var rows=sel.map(function(r){var g=getCreatorGrade(r.username)||{};return[r._applyNum,r.username,r.nickname,r.grade,g.video_quality||"",g.manager_evaluation||"",g.skintone||"",g.english_proficiency||"",r.nationality,r.tiktok_followers,r.tiktok_avg_views,r.instagram_followers,r.instagram_avg_views,r.caution,g.notes_manager||""];});
  var csv=[hdrs].concat(rows).map(function(row){return row.map(function(v){var s=String(v);return s.indexOf(",")>=0?'"'+s+'"':s;}).join(",");}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="sunjeong_"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

/* ============ GRADE EDIT ============ */
function openGradeEdit(handle){
  var username=handle.replace(/^@/,"");
  var g=getCreatorGrade(handle)||{};
  document.getElementById("panel").classList.remove("wide");
  document.getElementById("overlay").classList.add("open");
  document.getElementById("panelTitle").textContent="Edit Grade \u00b7 @"+username;
  document.getElementById("panelSub").textContent="Synced to Supabase";
  function mkSel(id,val,opts){return'<select class="grade-edit-select" id="'+id+'"><option value="">-</option>'+opts.map(function(o){return'<option value="'+o+'"'+(val===o?' selected':'')+'>'+o+'</option>';}).join('')+'</select>';}
  document.getElementById("panelBody").innerHTML=
    '<div class="grade-edit-row"><span class="grade-edit-label">Video Quality</span>'+mkSel("ge_vq",g.video_quality||"",["V1","V2","V3","V4","V5"])+'</div>'
    +'<div class="grade-edit-row"><span class="grade-edit-label">Manager Eval</span>'+mkSel("ge_me",g.manager_evaluation||"",["E1","E2","E3","E4","E5"])+'</div>'
    +'<div class="grade-edit-row"><span class="grade-edit-label">Skintone</span>'+mkSel("ge_sk",g.skintone||"",["Light","Fair","Medium","Tan","Deep"])+'</div>'
    +'<div class="grade-edit-row"><span class="grade-edit-label">English</span>'+mkSel("ge_en",g.english_proficiency||"",["Fluent","Good","Not Bad","Bad"])+'</div>'
    +'<div class="grade-edit-row"><span class="grade-edit-label">Blacklist</span><select class="grade-edit-select" id="ge_bl"><option value="false"'+(g.blacklist?'':' selected')+'>No</option><option value="true"'+(g.blacklist?' selected':'')+'>Yes</option></select></div>'
    +'<div class="grade-edit-row" style="border:none"><span class="grade-edit-label">Notes</span><input type="text" class="grade-edit-select" id="ge_notes" value="'+(g.notes_manager||"").replace(/"/g,"&quot;")+'" style="width:200px;" placeholder="Internal notes..."/></div>'
    +'<div id="ge_status" style="font-size:11px;color:#aaa;margin-top:8px;min-height:18px;"></div>';
  document.getElementById("panelFooter").innerHTML='<button class="pf-btn primary" onclick="saveGradeEdit(\''+handle+'\')">Save to Supabase</button><button class="pf-btn" onclick="closePanel()">Cancel</button>';
}

async function saveGradeEdit(handle){
  var s=document.getElementById("ge_status");s.textContent="Saving...";s.style.color="#aaa";
  var fields={video_quality:document.getElementById("ge_vq").value||null,manager_evaluation:document.getElementById("ge_me").value||null,skintone:document.getElementById("ge_sk").value||null,english_proficiency:document.getElementById("ge_en").value||null,blacklist:document.getElementById("ge_bl").value==="true",notes_manager:document.getElementById("ge_notes").value||null};
  var ok=await upsertCreatorGrade(handle,fields);
  if(ok){s.textContent="\u2713 Saved!";s.style.color="#1D9E75";renderSidebar();if(activeMainTab==="sunjeong")renderSjTable();setTimeout(closePanel,1000);}
  else{s.textContent="\u2717 Save failed";s.style.color="#e24b4a";}
}

/* ============ CREATORS PANEL ============ */
function buildCreatorRow(cr,g){
  var bl=g&&g.blacklist;
  return '<tr data-handle="'+cr.handle+'">'
    +'<td style="padding:6px 8px;font-weight:500;'+(bl?"color:#e24b4a;":"")+'">'+(bl?"[BL] ":"")+cr.handle+'</td>'
    +'<td style="padding:6px 8px;">'+cr.nick+'</td>'
    +'<td style="padding:6px 8px;">'+(g&&g.video_quality?'<span class="vgrade-pill">'+g.video_quality+'</span>':'-')+'</td>'
    +'<td style="padding:6px 8px;">'+(g&&g.manager_evaluation?'<span class="egrade-pill">'+g.manager_evaluation+'</span>':'-')+'</td>'
    +'<td style="padding:6px 8px;">'+(g&&g.skintone||'-')+'</td>'
    +'<td style="padding:6px 8px;">'+(g&&g.english_proficiency||'-')+'</td>'
    +'<td style="padding:6px 8px;font-size:10px;color:#888;max-width:160px;overflow:hidden;text-overflow:ellipsis;" title="'+(cr.campaigns||[]).join(', ')+'">'+(cr.campaigns||[]).join(', ')+'</td>'
    +'<td style="padding:6px 8px;"><button class="cr-edit-btn" data-handle="'+cr.handle+'" style="font-size:10px;padding:2px 8px;border-radius:5px;border:1px solid #e0e0e0;background:#fff;cursor:pointer;color:#534AB7;">Edit</button></td>'
    +'</tr>';
}

function renderCreatorsPanel(){
  document.getElementById("panel").classList.add("wide");
  var all={};
  Object.values(campaigns).forEach(function(c){
    (c.creators||[]).forEach(function(cr){
      var key=cr.handle.toLowerCase();
      if(!all[key])all[key]={handle:cr.handle,nick:cr.nick,campaigns:[]};
      all[key].campaigns.push(c.name);
    });
  });
  var list=Object.values(all).sort(function(a,b){return a.handle.localeCompare(b.handle);});
  var ths='padding:6px 8px;text-align:left;font-size:10px;color:#aaa;font-weight:600;text-transform:uppercase;border-bottom:1px solid #e5e5e5;position:sticky;top:0;background:#fafafa;white-space:nowrap;';
  var head='<tr>'+'<th style="'+ths+'">Username</th><th style="'+ths+'">Nick</th><th style="'+ths+'">V</th><th style="'+ths+'">E</th><th style="'+ths+'">Skintone</th><th style="'+ths+'">English</th><th style="'+ths+'">Campaigns</th><th style="'+ths+'"></th>'+'</tr>';
  var rows=list.map(function(cr){return buildCreatorRow(cr,getCreatorGrade(cr.handle)||{});}).join("");
  document.getElementById("panelBody").innerHTML=
    '<div style="margin-bottom:10px;display:flex;align-items:center;gap:10px;">'
    +'<input type="text" id="crSearch" placeholder="Search..." style="flex:1;padding:6px 10px;font-size:12px;border-radius:7px;border:1px solid #e0e0e0;outline:none;" oninput="filterCreatorsPanel(this.value)"/>'
    +'<span style="font-size:11px;color:#aaa;" id="crCount">'+list.length+' creators</span>'
    +'</div>'
    +'<div style="overflow-y:auto;max-height:calc(85vh - 280px);" id="crTableWrap">'
    +'<table style="width:100%;border-collapse:collapse;font-size:12px;"><thead>'+head+'</thead><tbody id="crBody">'+rows+'</tbody></table></div>'
    +'<div style="margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0;">'
    +'<div style="font-size:11px;font-weight:600;color:#555;margin-bottom:8px;">Add creator manually</div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">'
    +'<input type="text" id="crNewHandle" placeholder="@username" style="padding:5px 8px;font-size:12px;border-radius:6px;border:1px solid #e0e0e0;outline:none;width:130px;"/>'
    +'<input type="text" id="crNewNick" placeholder="Nickname" style="padding:5px 8px;font-size:12px;border-radius:6px;border:1px solid #e0e0e0;outline:none;width:130px;"/>'
    +'<select id="crNewCamp" style="padding:5px 8px;font-size:12px;border-radius:6px;border:1px solid #e0e0e0;outline:none;max-width:200px;">'
    +'<option value="">Select campaign...</option>'
    +Object.entries(campaigns).map(function(kv){return'<option value="'+kv[0]+'">'+kv[1].name+'</option>';}).join("")
    +'</select>'
    +'<button onclick="addCreatorManually()" style="padding:5px 12px;font-size:12px;border-radius:6px;border:1px solid #534AB755;background:#f0efff;color:#534AB7;cursor:pointer;">+ Add</button>'
    +'</div><div id="crAddSt" style="font-size:11px;color:#aaa;margin-top:5px;min-height:16px;"></div></div>';
  document.getElementById("panelFooter").innerHTML='<span style="font-size:11px;color:#aaa;">Edit to update grades (saves to Supabase)</span>';
  document.getElementById("crTableWrap").addEventListener("click",function(e){
    var btn=e.target.closest(".cr-edit-btn");
    if(btn)openGradeEdit(btn.getAttribute("data-handle"));
  });
  loadCreatorGrades(list.map(function(cr){return cr.handle;})).then(function(){
    var body=document.getElementById("crBody");
    if(body)body.innerHTML=list.map(function(cr){return buildCreatorRow(cr,getCreatorGrade(cr.handle)||{});}).join("");
  });
}

function filterCreatorsPanel(q){
  var rows=document.querySelectorAll("#crBody tr"),shown=0;
  rows.forEach(function(row){
    var match=!q||row.textContent.toLowerCase().includes(q.toLowerCase());
    row.style.display=match?"":"none";if(match)shown++;
  });
  var el=document.getElementById("crCount");if(el)el.textContent=shown+" creators";
}

function addCreatorManually(){
  var handle=(document.getElementById("crNewHandle").value||"").trim();
  var nick=(document.getElementById("crNewNick").value||"").trim();
  var campId=document.getElementById("crNewCamp").value;
  var st=document.getElementById("crAddSt");
  if(!handle){st.textContent="Enter a username.";st.style.color="#e24b4a";return;}
  if(!campId){st.textContent="Select a campaign.";st.style.color="#e24b4a";return;}
  var c=campaigns[campId];if(!c){st.textContent="Campaign not found.";st.style.color="#e24b4a";return;}
  var h=handle.startsWith("@")?handle:"@"+handle;
  if(c.creators.some(function(cr){return cr.handle.toLowerCase()===h.toLowerCase();})){
    st.textContent=h+" already in this campaign.";st.style.color="#EF9F27";return;
  }
  var newCr={id:uid(),applyNum:String(c.creators.length+1),handle:h,nick:nick||h};
  c.creators.push(newCr);c.state[newCr.id]={checks:{},status:"Pending Review"};
  c.master.forEach(function(s){s.items.forEach(function(it){c.state[newCr.id].checks[it.id]=false;});});
  saveToLocalStorage();if(activeCampaignId===campId)renderSidebar();
  st.textContent="Added: "+h+" to "+c.name;st.style.color="#1D9E75";
  document.getElementById("crNewHandle").value="";document.getElementById("crNewNick").value="";
  setTimeout(renderCreatorsPanel,400);
}

/* ============ PATCH openPanel for creators ============ */
var _origOpenPanel=openPanel;
function openPanel(type){
  if(type==="creators"){
    document.getElementById("panel").classList.remove("wide");
    document.getElementById("overlay").classList.add("open");
    document.getElementById("panelTitle").textContent="Creator List";
    document.getElementById("panelSub").textContent="View & manage all creators";
    renderCreatorsPanel();
    return;
  }
  _origOpenPanel(type);
}

</script>
