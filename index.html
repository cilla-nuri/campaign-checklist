<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campaign Checklist</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;}
.app{display:flex;flex-direction:column;height:700px;width:100%;max-width:920px;border:1px solid #e5e5e5;border-radius:12px;overflow:hidden;background:#fff;}

/* Top campaign bar */
.campaign-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #e5e5e5;background:#fafafa;flex-shrink:0;}
.campaign-bar-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap;}
.campaign-select-wrap{position:relative;flex:1;max-width:260px;}
.campaign-select-wrap select{width:100%;padding:5px 28px 5px 10px;font-size:13px;font-weight:500;color:#1a1a1a;background:#fff;border:1px solid #e0e0e0;border-radius:7px;outline:none;appearance:none;cursor:pointer;}
.campaign-select-wrap select:focus{border-color:#ccc;}
.campaign-select-wrap .ti{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:13px;color:#aaa;pointer-events:none;}
.bar-btn{font-size:11px;padding:5px 10px;border-radius:7px;border:1px solid #e0e0e0;background:#fff;color:#555;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.bar-btn:hover{background:#f5f5f5;}
.bar-btn.new{border-color:#7F77DD55;color:#534AB7;background:#f0efff;}
.bar-btn.new:hover{background:#e4e2ff;}
.bar-btn.danger{color:#e24b4a;border-color:#e24b4a44;}
.bar-btn.danger:hover{background:#fff5f5;}
.campaign-badge{font-size:10px;padding:3px 8px;border-radius:20px;background:#1D9E7510;color:#1D9E75;border:1px solid #1D9E7530;white-space:nowrap;}
.bar-spacer{flex:1;}

/* Body */
.body-wrap{display:flex;flex:1;overflow:hidden;}
.sidebar{width:230px;border-right:1px solid #e5e5e5;display:flex;flex-direction:column;flex-shrink:0;background:#fff;}
.sidebar-header{padding:10px 12px;border-bottom:1px solid #e5e5e5;}
.header-actions{display:flex;gap:5px;flex-wrap:wrap;}
.hbtn{font-size:11px;padding:4px 8px;border-radius:7px;border:1px solid #e0e0e0;background:transparent;color:#555;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap;}
.hbtn:hover{background:#f5f5f5;}
.hbtn.ai{border-color:#c4c1f7;color:#534AB7;background:#f0efff;}
.hbtn.ai:hover{background:#e4e2ff;}
.search-wrap{padding:8px;border-bottom:1px solid #e5e5e5;position:relative;}
.search-wrap .ti{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:13px;color:#aaa;pointer-events:none;}
#searchInput{width:100%;padding:6px 8px 6px 28px;font-size:12px;border-radius:7px;border:1px solid #e5e5e5;background:#f9f9f9;color:#1a1a1a;outline:none;}
#searchInput:focus{border-color:#ccc;background:#fff;}
.creator-list{flex:1;overflow-y:auto;padding:6px;}
.creator-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
.creator-item:hover{background:#f5f5f5;}
.creator-item.active{background:#f0f0f0;}
.creator-item.hidden{display:none;}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;}
.creator-info{flex:1;min-width:0;}
.creator-handle{font-size:12px;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.creator-nick{font-size:10px;color:#aaa;}
.ppill{font-size:10px;font-weight:600;padding:2px 6px;border-radius:20px;flex-shrink:0;background:#f0f0f0;color:#aaa;}
.empty-msg{font-size:12px;color:#aaa;text-align:center;padding:16px 8px;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:#fff;}
.main-header{padding:12px 18px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.main-title{font-size:14px;font-weight:600;color:#1a1a1a;}
.main-sub{font-size:11px;color:#aaa;margin-top:2px;}
.sbadge{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;border:1px solid;cursor:pointer;white-space:nowrap;}
.checklist-area{flex:1;overflow-y:auto;padding:14px 18px;}
.sec-label{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:0.07em;margin:14px 0 6px;}
.sec-label:first-child{margin-top:0;}
.chk-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0;cursor:pointer;}
.chk-item:last-child{border-bottom:none;}
.chk-box{width:17px;height:17px;border-radius:5px;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all 0.12s;background:transparent;}
.chk-box.on{background:#1D9E75;border-color:#1D9E75;}
.chk-ic{display:none;color:#fff;font-size:11px;}
.chk-box.on .chk-ic{display:block;}
.chk-lbl{font-size:12px;color:#1a1a1a;line-height:1.5;}
.chk-lbl.done{color:#bbb;text-decoration:line-through;}
.footer{padding:10px 18px;border-top:1px solid #e5e5e5;display:flex;align-items:center;gap:10px;}
.pbar-wrap{flex:1;height:3px;background:#f0f0f0;border-radius:3px;}
.pbar-fill{height:100%;border-radius:3px;background:#1D9E75;transition:width 0.2s;}
.ftext{font-size:11px;color:#aaa;white-space:nowrap;}
.fbtn{font-size:11px;font-weight:500;padding:6px 12px;border-radius:7px;border:1px solid #e0e0e0;background:#fff;color:#1a1a1a;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;}
.fbtn:hover{background:#f5f5f5;}
mark{background:#fde68a;color:inherit;border-radius:2px;padding:0 1px;}

/* Overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.25);z-index:100;align-items:flex-start;justify-content:center;padding-top:40px;}
.overlay.open{display:flex;}
.panel{background:#fff;border-radius:12px;border:1px solid #e5e5e5;width:500px;max-height:580px;display:flex;flex-direction:column;overflow:hidden;}
.ph{padding:14px 18px;border-bottom:1px solid #e5e5e5;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.ph-title{font-size:14px;font-weight:600;color:#1a1a1a;}
.ph-sub{font-size:11px;color:#aaa;margin-top:2px;}
.xbtn{background:none;border:none;cursor:pointer;color:#999;font-size:17px;padding:2px;}
.xbtn:hover{color:#333;}
.pb{flex:1;overflow-y:auto;padding:14px 18px;}
.pf{padding:10px 18px;border-top:1px solid #e5e5e5;display:flex;align-items:center;gap:8px;}
.pf-warn{flex:1;font-size:11px;color:#aaa;}
.sec-block{margin-bottom:14px;}
.sec-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.sec-inp{flex:1;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#aaa;background:transparent;border:none;outline:none;padding:2px 4px;border-radius:4px;}
.sec-inp:focus{background:#f5f5f5;}
.smb{font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid #e0e0e0;background:transparent;color:#555;cursor:pointer;}
.smb:hover{background:#f5f5f5;}
.dsbtn{font-size:13px;color:#bbb;background:none;border:none;cursor:pointer;padding:2px 4px;}
.dsbtn:hover{color:#e24b4a;}
.irow{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #f5f5f5;}
.irow:last-child{border-bottom:none;}
.itxt{flex:1;font-size:12px;color:#1a1a1a;background:transparent;border:none;outline:none;padding:2px 4px;border-radius:4px;}
.itxt:focus{background:#f5f5f5;}
.dibtn{font-size:12px;color:#bbb;background:none;border:none;cursor:pointer;padding:2px 3px;opacity:0;}
.irow:hover .dibtn{opacity:1;}
.dibtn:hover{color:#e24b4a;}
.ai-textarea{width:100%;min-height:160px;font-size:12px;padding:10px;border-radius:8px;border:1px solid #e5e5e5;background:#f9f9f9;color:#1a1a1a;resize:vertical;outline:none;font-family:inherit;}
.ai-textarea:focus{border-color:#ccc;background:#fff;}
.ai-status{font-size:12px;color:#aaa;min-height:18px;margin-top:6px;}
.hint{font-size:11px;color:#aaa;line-height:1.6;margin-bottom:10px;}
.drop-zone{border:1.5px dashed #ddd;border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:background 0.1s;}
.drop-zone:hover,.drop-zone.drag{background:#f5f5f5;}
.drop-zone p{font-size:12px;color:#666;margin-top:6px;}
.drop-zone small{font-size:11px;color:#aaa;}
.csv-preview{margin-top:10px;}
.csv-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:11px;color:#1a1a1a;}
.csv-row:last-child{border-bottom:none;}
.csv-row span{color:#aaa;}
.notion-input{width:100%;padding:8px 10px;font-size:12px;border-radius:8px;border:1px solid #e5e5e5;background:#f9f9f9;color:#1a1a1a;outline:none;font-family:inherit;margin-bottom:8px;}
.notion-input:focus{border-color:#ccc;background:#fff;}
.field-label{font-size:11px;color:#aaa;margin-bottom:4px;display:block;}
.apply-btn{font-size:11px;font-weight:500;padding:6px 14px;border-radius:7px;border:1px solid #1D9E7555;background:#1D9E7510;color:#1D9E75;cursor:pointer;}
.apply-btn:hover{background:#1D9E7520;}
.ai-gen-btn{font-size:11px;font-weight:500;padding:6px 14px;border-radius:7px;border:1px solid #7F77DD55;background:#f0efff;color:#534AB7;cursor:pointer;display:flex;align-items:center;gap:5px;}
.ai-gen-btn:hover{background:#e4e2ff;}
.ai-gen-btn:disabled{opacity:0.5;cursor:not-allowed;}
.new-campaign-form{display:flex;flex-direction:column;gap:10px;}
.nc-input{width:100%;padding:8px 10px;font-size:13px;border-radius:8px;border:1px solid #e5e5e5;background:#f9f9f9;color:#1a1a1a;outline:none;font-family:inherit;}
.nc-input:focus{border-color:#ccc;background:#fff;}
</style>
</head>
<body>
<div class="app">

  <!-- Campaign switcher bar -->
  <div class="campaign-bar">
    <span class="campaign-bar-label">Campaign</span>
    <div class="campaign-select-wrap">
      <select id="campaignSelect" onchange="switchCampaign(this.value)">
        <option value="">— select —</option>
      </select>
      <i class="ti ti-chevron-down"></i>
    </div>
    <button class="bar-btn new" onclick="openPanel('newcampaign')"><i class="ti ti-plus"></i> New campaign</button>
    <div class="bar-spacer"></div>
    <div class="bar-btn danger" onclick="deleteCampaign()" id="delCampaignBtn" style="display:none"><i class="ti ti-trash"></i> Delete</div>
    <button class="bar-btn" onclick="openPanel('notion')"><i class="ti ti-brand-notion"></i> Notion</button>
  </div>

  <div class="body-wrap">
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="header-actions">
          <button class="hbtn ai" onclick="openPanel('ai')"><i class="ti ti-sparkles"></i> AI guideline</button>
          <button class="hbtn" onclick="openPanel('csv')"><i class="ti ti-upload"></i> CSV</button>
          <button class="hbtn" onclick="openPanel('master')"><i class="ti ti-adjustments-horizontal"></i> Master</button>
        </div>
      </div>
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input id="searchInput" type="text" placeholder="Search creator..." oninput="filterCreators(this.value)"/>
      </div>
      <div class="creator-list" id="creatorList">
        <div class="empty-msg" id="noCreators">Create or select a campaign first</div>
      </div>
      <div class="empty-msg" id="noSearch" style="display:none;">No creators found</div>
    </div>

    <div class="main">
      <div class="main-header">
        <div>
          <div class="main-title" id="mainTitle">No campaign selected</div>
          <div class="main-sub" id="mainSub">Create a new campaign to get started</div>
        </div>
        <div class="sbadge" id="sbadge" style="display:none" onclick="cycleStatus()"></div>
      </div>
      <div class="checklist-area" id="checklistArea">
        <div style="color:#aaa;font-size:12px;margin-top:80px;text-align:center;line-height:2.2;">
          <i class="ti ti-layout-kanban" style="font-size:24px;display:block;margin-bottom:8px;"></i>
          Click <strong>+ New campaign</strong> to get started
        </div>
      </div>
      <div class="footer">
        <span class="ftext" id="ftext">— / — items</span>
        <div class="pbar-wrap"><div class="pbar-fill" id="pbarFill" style="width:0%"></div></div>
        <button class="fbtn" onclick="saveToNotion()"><i class="ti ti-device-floppy"></i> Save to Notion</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="bgClick(event)">
  <div class="panel" id="panel">
    <div class="ph">
      <div><div class="ph-title" id="panelTitle"></div><div class="ph-sub" id="panelSub"></div></div>
      <button class="xbtn" onclick="closePanel()"><i class="ti ti-x"></i></button>
    </div>
    <div class="pb" id="panelBody"></div>
    <div class="pf" id="panelFooter"></div>
  </div>
</div>

<script>
const AVC=["#e8e6ff","#d1f5e8","#fde8d8","#fce4ef","#daeaf8","#e5f5ce","#fff3d6","#fde8f0"];
const AVT=["#534AB7","#085041","#712B13","#72243E","#0C447C","#27500A","#7a5200","#7a1a3a"];
const STATUSES=["Pending Review","In Review","Revision Requested","Approved"];
const SCOL={"Pending Review":"#888","In Review":"#378ADD","Revision Requested":"#EF9F27","Approved":"#1D9E75"};

let campaigns={};
let activeCampaignId=null;
let activeCreatorId=null;
let notionToken="", notionDbId="";
let idc=500;
function uid(){return"u"+(++idc);}

function getCampaign(){return activeCampaignId?campaigns[activeCampaignId]:null;}

function newCampaign(name){
  const id=uid();
  campaigns[id]={id,name,creators:[],master:[],state:{}};
  return id;
}

function refreshCampaignSelect(){
  const sel=document.getElementById("campaignSelect");
  const ids=Object.keys(campaigns);
  sel.innerHTML='<option value="">— select —</option>'+ids.map(id=>`<option value="${id}" ${id===activeCampaignId?"selected":""}>${campaigns[id].name}</option>`).join("");
}

function switchCampaign(id){
  if(!id){activeCampaignId=null;resetUI();return;}
  activeCampaignId=id;
  activeCreatorId=null;
  document.getElementById("searchInput").value="";
  document.getElementById("delCampaignBtn").style.display="flex";
  renderSidebar();
  resetMainPanel();
}

function deleteCampaign(){
  if(!activeCampaignId)return;
  const name=campaigns[activeCampaignId].name;
  if(!confirm(`Delete campaign "${name}"? This cannot be undone.`))return;
  delete campaigns[activeCampaignId];
  activeCampaignId=null;
  activeCreatorId=null;
  document.getElementById("delCampaignBtn").style.display="none";
  refreshCampaignSelect();
  resetUI();
}

function resetUI(){
  document.getElementById("mainTitle").textContent="No campaign selected";
  document.getElementById("mainSub").textContent="Create a new campaign to get started";
  document.getElementById("sbadge").style.display="none";
  document.getElementById("checklistArea").innerHTML=`<div style="color:#aaa;font-size:12px;margin-top:80px;text-align:center;line-height:2.2;"><i class="ti ti-layout-kanban" style="font-size:24px;display:block;margin-bottom:8px;"></i>Click <strong>+ New campaign</strong> to get started</div>`;
  document.getElementById("ftext").textContent="— / — items";
  document.getElementById("pbarFill").style.width="0%";
  document.getElementById("creatorList").innerHTML=`<div class="empty-msg" id="noCreators">Create or select a campaign first</div>`;
  document.getElementById("noSearch").style.display="none";
}

function resetMainPanel(){
  activeCreatorId=null;
  const c=getCampaign();
  document.getElementById("mainTitle").textContent=c?c.name:"No campaign selected";
  document.getElementById("mainSub").textContent=c?`${c.creators.length} creators · ${c.master.reduce((a,s)=>a+s.items.length,0)} checklist items`:"";
  document.getElementById("sbadge").style.display="none";
  document.getElementById("checklistArea").innerHTML=`<div style="color:#aaa;font-size:12px;margin-top:80px;text-align:center;line-height:2.2;"><i class="ti ti-users" style="font-size:24px;display:block;margin-bottom:8px;"></i>${c&&c.creators.length?"Select a creator from the sidebar":"Import creators via CSV and a guideline via AI"}</div>`;
  document.getElementById("ftext").textContent="— / — items";
  document.getElementById("pbarFill").style.width="0%";
}

function buildState(){
  const c=getCampaign();if(!c)return;
  c.creators.forEach(cr=>{
    if(!c.state[cr.id])c.state[cr.id]={status:"Pending Review",checks:{}};
    const ex=c.state[cr.id].checks,nc={};
    c.master.forEach(s=>s.items.forEach(it=>{nc[it.id]=ex[it.id]||false;}));
    c.state[cr.id].checks=nc;
  });
}

function initials(n){return n.split(" ").map(w=>w[0]||"").join("").toUpperCase().slice(0,2);}

function renderSidebar(){
  const c=getCampaign();
  const list=document.getElementById("creatorList");
  if(!c||!c.creators.length){
    list.innerHTML=`<div class="empty-msg" id="noCreators">Import a CSV to load creators</div>`;
    return;
  }
  list.innerHTML=c.creators.map((cr,i)=>`
    <div class="creator-item ${cr.id===activeCreatorId?"active":""}" id="ci-${cr.id}" onclick="selectCreator('${cr.id}')">
      <div class="avatar" style="background:${AVC[i%AVC.length]};color:${AVT[i%AVT.length]}">${initials(cr.nick)}</div>
      <div class="creator-info">
        <div class="creator-handle">${cr.handle}</div>
        <div class="creator-nick">#${cr.applyNum} · ${cr.nick}</div>
      </div>
      <div class="ppill" id="pp-${cr.id}">${getPct(c,cr.id)}%</div>
    </div>`).join("");
  updateAllPills();
}

function getPct(c,id){
  if(!c.state[id])return 0;
  const ch=c.state[id].checks,total=Object.keys(ch).length,done=Object.values(ch).filter(Boolean).length;
  return total?Math.round(done/total*100):0;
}

function filterCreators(q){
  const c=getCampaign();if(!c)return;
  q=q.trim().toLowerCase();let vis=0;
  c.creators.forEach(cr=>{
    const el=document.getElementById("ci-"+cr.id);if(!el)return;
    const match=!q||cr.handle.toLowerCase().includes(q)||cr.nick.toLowerCase().includes(q)||cr.applyNum.includes(q);
    el.classList.toggle("hidden",!match);
    if(match){vis++;el.querySelector(".creator-handle").innerHTML=hl(cr.handle,q);el.querySelector(".creator-nick").innerHTML=hl("#"+cr.applyNum+" · "+cr.nick,q);}
    else{el.querySelector(".creator-handle").textContent=cr.handle;el.querySelector(".creator-nick").textContent="#"+cr.applyNum+" · "+cr.nick;}
  });
  document.getElementById("noSearch").style.display=(vis===0&&c.creators.length>0)?"block":"none";
}

function hl(t,q){if(!q)return t;return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");}

function selectCreator(id){
  const c=getCampaign();if(!c)return;
  activeCreatorId=id;
  document.querySelectorAll(".creator-item").forEach(e=>e.classList.remove("active"));
  document.getElementById("ci-"+id)?.classList.add("active");
  const cr=c.creators.find(x=>x.id===id);
  document.getElementById("mainTitle").textContent=cr.nick;
  document.getElementById("mainSub").textContent=cr.handle+" · Apply #"+cr.applyNum+" · "+c.name;
  document.getElementById("sbadge").style.display="block";
  renderBadge();renderChecklist();
}

function renderBadge(){
  const c=getCampaign();if(!c||!activeCreatorId)return;
  const s=c.state[activeCreatorId].status,b=document.getElementById("sbadge");
  b.textContent=s;b.style.color=SCOL[s];b.style.borderColor=SCOL[s]+"55";b.style.background=SCOL[s]+"18";
}

function cycleStatus(){
  const c=getCampaign();if(!c||!activeCreatorId)return;
  c.state[activeCreatorId].status=STATUSES[(STATUSES.indexOf(c.state[activeCreatorId].status)+1)%STATUSES.length];
  renderBadge();
}

function renderChecklist(){
  const c=getCampaign();if(!c||!activeCreatorId)return;
  const checks=c.state[activeCreatorId].checks;
  let html="";
  c.master.forEach(s=>{
    if(!s.items.length)return;
    html+=`<div class="sec-label">${s.name}</div>`;
    s.items.forEach(it=>{
      const done=checks[it.id];
      html+=`<div class="chk-item" onclick="toggle('${activeCreatorId}','${it.id}')">
        <div class="chk-box ${done?"on":""}"><i class="ti ti-check chk-ic"></i></div>
        <span class="chk-lbl ${done?"done":""}">${it.text}</span></div>`;
    });
  });
  if(!html)html=`<div style="color:#aaa;font-size:12px;margin-top:40px;text-align:center;">No checklist items — use AI guideline or Master.</div>`;
  document.getElementById("checklistArea").innerHTML=html;
  updateFooter();
}

function toggle(creatorId,iid){
  const c=getCampaign();if(!c)return;
  c.state[creatorId].checks[iid]=!c.state[creatorId].checks[iid];
  renderChecklist();updatePill(creatorId);
}

function updateFooter(){
  const c=getCampaign();if(!c||!activeCreatorId)return;
  const ch=c.state[activeCreatorId].checks;
  const total=Object.keys(ch).length,done=Object.values(ch).filter(Boolean).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById("ftext").textContent=`${done} / ${total} items`;
  document.getElementById("pbarFill").style.width=pct+"%";
}

function updatePill(id){
  const c=getCampaign();if(!c)return;
  const pct=getPct(c,id);
  const p=document.getElementById("pp-"+id);if(!p)return;
  p.textContent=pct+"%";
  if(pct===100){p.style.background="#1D9E7520";p.style.color="#1D9E75";}
  else if(pct>0){p.style.background="#378ADD20";p.style.color="#378ADD";}
  else{p.style.background="#f0f0f0";p.style.color="#aaa";}
}

function updateAllPills(){const c=getCampaign();if(!c)return;c.creators.forEach(cr=>updatePill(cr.id));}

async function saveToNotion(){
  const c=getCampaign();
  if(!activeCreatorId||!c){alert("Select a creator first.");return;}
  if(!notionToken||!notionDbId){openPanel("notion");return;}
  const cr=c.creators.find(x=>x.id===activeCreatorId);
  const s=c.state[activeCreatorId];
  const checklistText=c.master.map(sec=>sec.name+":\n"+sec.items.map(it=>(s.checks[it.id]?"[x] ":"[ ] ")+it.text).join("\n")).join("\n\n");
  const btn=document.querySelector(".fbtn");
  btn.textContent="Saving...";btn.disabled=true;
  try{
    const res=await fetch("https://api.notion.com/v1/pages",{
      method:"POST",
      headers:{"Authorization":"Bearer "+notionToken,"Content-Type":"application/json","Notion-Version":"2022-06-28"},
      body:JSON.stringify({
        parent:{database_id:notionDbId},
        properties:{
          "Creator Name":{title:[{text:{content:cr.nick}}]},
          "Campaign":{rich_text:[{text:{content:c.name}}]},
          "Status":{select:{name:s.status}},
        },
        children:[{object:"block",type:"paragraph",paragraph:{rich_text:[{text:{content:checklistText}}]}}]
      })
    });
    if(res.ok){btn.innerHTML='<i class="ti ti-check"></i> Saved!';btn.style.color="#1D9E75";}
    else{btn.textContent="Error — check Notion settings";}
  }catch(e){btn.textContent="Error saving";}
  setTimeout(()=>{btn.innerHTML='<i class="ti ti-device-floppy"></i> Save to Notion';btn.style.color="";btn.disabled=false;},2500);
}

let parsedCreators=[], masterDraft=[];

function openPanel(type){
  const c=getCampaign();
  const overlay=document.getElementById("overlay");
  overlay.classList.add("open");
  const titles={newcampaign:"New campaign",ai:"AI guideline parser",csv:"Import creators",master:"Master checklist",notion:"Notion settings"};
  const subs={newcampaign:"Give your campaign a name to get started",ai:"Paste guideline — AI builds the checklist automatically",csv:"Upload CSV with apply number, ID (username), nickname",master:"Edit sections and items — applies to all creators in this campaign",notion:"Connect your Notion database"};
  document.getElementById("panelTitle").textContent=titles[type];
  document.getElementById("panelSub").textContent=subs[type];
  if(type==="newcampaign")renderNewCampaignPanel();
  else if(type==="ai")renderAIPanel();
  else if(type==="csv")renderCSVPanel();
  else if(type==="master"){masterDraft=JSON.parse(JSON.stringify(c?c.master:[]));renderMasterPanel();}
  else if(type==="notion")renderNotionPanel();
}

function closePanel(){document.getElementById("overlay").classList.remove("open");}
function bgClick(e){if(e.target===document.getElementById("overlay"))closePanel();}

function renderNewCampaignPanel(){
  document.getElementById("panelBody").innerHTML=`
    <div class="new-campaign-form">
      <p class="hint">Each campaign has its own creators, guideline, and checklist. You can switch between them anytime.</p>
      <label class="field-label">Campaign name</label>
      <input class="nc-input" id="ncName" type="text" placeholder="e.g. Magis Lene · iWorld Q3" autofocus/>
    </div>`;
  document.getElementById("panelFooter").innerHTML=`
    <span class="pf-warn" id="pfWarn"></span>
    <button class="apply-btn" onclick="createCampaign()">Create campaign</button>`;
  setTimeout(()=>document.getElementById("ncName")?.focus(),100);
  document.getElementById("ncName")?.addEventListener("keydown",e=>{if(e.key==="Enter")createCampaign();});
}

function createCampaign(){
  const name=document.getElementById("ncName")?.value.trim();
  if(!name){document.getElementById("pfWarn").textContent="Please enter a campaign name.";return;}
  const id=newCampaign(name);
  activeCampaignId=id;
  activeCreatorId=null;
  document.getElementById("delCampaignBtn").style.display="flex";
  refreshCampaignSelect();
  renderSidebar();
  resetMainPanel();
  closePanel();
}

function renderAIPanel(){
  if(!activeCampaignId){document.getElementById("panelBody").innerHTML=`<p class="hint" style="color:#e24b4a;">Please create or select a campaign first.</p>`;document.getElementById("panelFooter").innerHTML="";return;}
  document.getElementById("panelBody").innerHTML=`
    <div>
      <p class="hint">Paste your campaign guideline. AI will extract sections, required phrases, prohibited words, tagging rules and more.</p>
      <textarea class="ai-textarea" id="guidelineText" placeholder="Paste campaign guideline here..."></textarea>
      <div class="ai-status" id="aiStatus"></div>
    </div>`;
  document.getElementById("panelFooter").innerHTML=`
    <span class="pf-warn" id="pfWarn"></span>
    <button class="ai-gen-btn" id="aiBtn" onclick="runAI()"><i class="ti ti-sparkles"></i> Generate checklist</button>`;
}

async function runAI(){
  const text=document.getElementById("guidelineText")?.value.trim();
  if(!text){document.getElementById("pfWarn").textContent="Please paste a guideline first.";return;}
  document.getElementById("pfWarn").textContent="";
  const status=document.getElementById("aiStatus");
  const btn=document.getElementById("aiBtn");
  status.textContent="Reading guideline...";status.style.color="#aaa";
  btn.disabled=true;
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1000,
        messages:[{role:"user",content:`You are a campaign review assistant. Read this campaign guideline and extract a structured checklist for reviewing creator content.

Return ONLY valid JSON, no preamble, no markdown:
{"campaignName":"short campaign name","sections":[{"name":"Section Name","items":["checklist item 1","checklist item 2"]}]}

Group into logical sections (Content, Claims, Branding, Delivery etc). Keep items concise and checkable.

Guideline:\n${text}`}]
      })
    });
    const data=await res.json();
    const raw=data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
    const parsed=JSON.parse(raw.replace(/```json|```/g,"").trim());
    const c=getCampaign();
    c.master=parsed.sections.map(s=>({id:uid(),name:s.name,items:s.items.map(txt=>({id:uid(),text:txt}))}));
    if(parsed.campaignName&&c.name==="Untitled Campaign")c.name=parsed.campaignName;
    buildState();
    if(activeCreatorId)renderChecklist();
    updateAllPills();
    refreshCampaignSelect();
    resetMainPanel();
    status.textContent=`Done — ${c.master.reduce((a,s)=>a+s.items.length,0)} items across ${c.master.length} sections.`;
    status.style.color="#1D9E75";
    setTimeout(closePanel,1400);
  }catch(e){
    status.textContent="Something went wrong. Please try again.";
    status.style.color="#e24b4a";
  }
  btn.disabled=false;
}

function renderCSVPanel(){
  if(!activeCampaignId){document.getElementById("panelBody").innerHTML=`<p class="hint" style="color:#e24b4a;">Please create or select a campaign first.</p>`;document.getElementById("panelFooter").innerHTML="";return;}
  document.getElementById("panelBody").innerHTML=`
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('csvFile').click()" ondragover="dzOver(event)" ondragleave="dzLeave()" ondrop="dzDrop(event)">
      <i class="ti ti-upload" style="font-size:28px;color:#bbb;"></i>
      <p>Click to upload or drag & drop your CSV</p>
      <small>Columns: apply number · ID (username) · nickname</small>
      <input type="file" id="csvFile" accept=".csv" style="display:none" onchange="handleCSV(this.files[0])"/>
    </div>
    <div class="csv-preview" id="csvPreview"></div>`;
  document.getElementById("panelFooter").innerHTML=`
    <span class="pf-warn" id="pfWarn"></span>
    <button class="fbtn" onclick="applyCSV()" id="applyCSVBtn" disabled style="opacity:0.4;">Import creators</button>`;
}

function dzOver(e){e.preventDefault();document.getElementById("dropZone").classList.add("drag");}
function dzLeave(){document.getElementById("dropZone").classList.remove("drag");}
function dzDrop(e){e.preventDefault();dzLeave();if(e.dataTransfer.files[0])handleCSV(e.dataTransfer.files[0]);}

function handleCSV(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const lines=e.target.result.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){document.getElementById("pfWarn").textContent="CSV seems empty.";return;}
    const header=lines[0].split(",").map(h=>h.trim().toLowerCase().replace(/['"]/g,""));
    const applyIdx=header.findIndex(h=>h.includes("apply")||h==="no"||h==="#"||h.includes("number"));
    const idIdx=header.findIndex(h=>h==="id"||h.includes("username")||h.includes("handle"));
    const nickIdx=header.findIndex(h=>h.includes("nick")||h.includes("name"));
    if(applyIdx<0||idIdx<0||nickIdx<0){document.getElementById("pfWarn").textContent="Could not find columns. Need: apply number, ID, nickname.";return;}
    parsedCreators=[];const preview=[];
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(",").map(c=>c.trim().replace(/^["']|["']$/g,""));
      if(!cols[idIdx])continue;
      const cr={id:uid(),applyNum:cols[applyIdx]||String(i),handle:cols[idIdx].startsWith("@")?cols[idIdx]:"@"+cols[idIdx],nick:cols[nickIdx]||cols[idIdx]};
      parsedCreators.push(cr);if(preview.length<4)preview.push(cr);
    }
    document.getElementById("csvPreview").innerHTML=
      `<div style="font-size:11px;color:#aaa;margin:10px 0 6px;">${parsedCreators.length} creators found — preview:</div>`+
      preview.map(c=>`<div class="csv-row"><strong>#${c.applyNum}</strong><span>${c.handle}</span><span>${c.nick}</span></div>`).join("")+
      (parsedCreators.length>4?`<div style="font-size:11px;color:#aaa;padding:4px 0;">+${parsedCreators.length-4} more</div>`:"");
    const btn=document.getElementById("applyCSVBtn");btn.disabled=false;btn.style.opacity="1";
    document.getElementById("pfWarn").textContent="";
  };
  reader.readAsText(file);
}

function applyCSV(){
  if(!parsedCreators.length)return;
  const c=getCampaign();if(!c)return;
  c.creators=parsedCreators;
  buildState();renderSidebar();resetMainPanel();closePanel();
}

function renderNotionPanel(){
  document.getElementById("panelBody").innerHTML=`
    <div>
      <p class="hint">Enter your Notion integration token and the ID of the Creator Campaign Tracker database.</p>
      <label class="field-label">Integration token</label>
      <input class="notion-input" id="nToken" type="password" placeholder="secret_xxxxxxxxxxxx" value="${notionToken}"/>
      <label class="field-label">Database ID</label>
      <input class="notion-input" id="nDbId" type="text" placeholder="32-character database ID" value="${notionDbId}"/>
      <p class="hint">Find it in your Notion database URL — the string after the last / and before ?v=</p>
    </div>`;
  document.getElementById("panelFooter").innerHTML=`
    <span class="pf-warn" id="pfWarn"></span>
    <button class="apply-btn" onclick="saveNotionSettings()">Save settings</button>`;
}

function saveNotionSettings(){
  notionToken=document.getElementById("nToken").value.trim();
  notionDbId=document.getElementById("nDbId").value.trim().replace(/-/g,"");
  if(!notionToken||!notionDbId){document.getElementById("pfWarn").textContent="Both fields required.";return;}
  closePanel();
}

function renderMasterPanel(){
  const c=getCampaign();
  if(!c){document.getElementById("panelBody").innerHTML=`<p class="hint" style="color:#e24b4a;">Please create or select a campaign first.</p>`;document.getElementById("panelFooter").innerHTML="";return;}
  const body=document.getElementById("panelBody");
  body.innerHTML=masterDraft.length?masterDraft.map(s=>renderSecBlock(s)).join(""):
    `<div style="font-size:12px;color:#aaa;text-align:center;padding:20px 0;">No items yet — use AI guideline or add sections manually.</div>`;
  document.getElementById("panelFooter").innerHTML=`
    <button class="smb" onclick="addSec()"><i class="ti ti-plus"></i> Section</button>
    <span class="pf-warn" id="pfWarn"></span>
    <button class="apply-btn" onclick="applyMaster()">Apply to all</button>`;
}

function renderSecBlock(s){
  return`<div class="sec-block" id="sb-${s.id}">
    <div class="sec-row">
      <input class="sec-inp" value="${s.name}" oninput="updSecName('${s.id}',this.value)"/>
      <button class="smb" onclick="addItm('${s.id}')"><i class="ti ti-plus"></i> Item</button>
      <button class="dsbtn" onclick="delSec('${s.id}')"><i class="ti ti-trash"></i></button>
    </div>
    ${s.items.map(it=>`<div class="irow" id="ir-${it.id}">
      <i class="ti ti-grip-vertical" style="color:#ccc;font-size:13px;"></i>
      <input class="itxt" value="${it.text}" oninput="updItm('${s.id}','${it.id}',this.value)"/>
      <button class="dibtn" onclick="delItm('${s.id}','${it.id}')"><i class="ti ti-x"></i></button>
    </div>`).join("")}
  </div>`;}

function updSecName(sid,v){const s=masterDraft.find(x=>x.id===sid);if(s)s.name=v;}
function updItm(sid,iid,v){const s=masterDraft.find(x=>x.id===sid);if(s){const it=s.items.find(x=>x.id===iid);if(it)it.text=v;}}

function addItm(sid){
  const s=masterDraft.find(x=>x.id===sid);if(!s)return;
  const it={id:uid(),text:"New item"};s.items.push(it);
  document.getElementById("sb-"+sid).insertAdjacentHTML("beforeend",
    `<div class="irow" id="ir-${it.id}">
      <i class="ti ti-grip-vertical" style="color:#ccc;font-size:13px;"></i>
      <input class="itxt" value="${it.text}" oninput="updItm('${sid}','${it.id}',this.value)" style="background:#f5f5f5;"/>
      <button class="dibtn" onclick="delItm('${sid}','${it.id}')" style="opacity:1"><i class="ti ti-x"></i></button>
    </div>`);
  const inp=document.querySelector(`#ir-${it.id} input`);if(inp){inp.focus();inp.select();}
}

function delItm(sid,iid){
  const s=masterDraft.find(x=>x.id===sid);if(s)s.items=s.items.filter(x=>x.id!==iid);
  document.getElementById("ir-"+iid)?.remove();
}

function delSec(sid){masterDraft=masterDraft.filter(x=>x.id!==sid);document.getElementById("sb-"+sid)?.remove();}

function addSec(){
  const s={id:uid(),name:"New section",items:[]};masterDraft.push(s);
  document.getElementById("panelBody").insertAdjacentHTML("beforeend",renderSecBlock(s));
  const inp=document.querySelector(`#sb-${s.id} .sec-inp`);if(inp){inp.focus();inp.select();}
}

function applyMaster(){
  const c=getCampaign();if(!c)return;
  c.master=JSON.parse(JSON.stringify(masterDraft));
  buildState();if(activeCreatorId)renderChecklist();
  updateAllPills();resetMainPanel();closePanel();
}
</script>
